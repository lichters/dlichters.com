<style>

--grad:linear-gradient(96deg,#0071e3 0%,#5e5ce6 52%,#9b3fd6 100%);
--fbg:#f1f1f1;--fcopy:#4c4c4c;--fline:#e5e5e5;--flogo:#9292a1;--flink:#0066cc;--fog:255,255,255}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",

display:flex;flex-direction:column;min-height:100vh}
body>main{flex:1 0 auto;width:100%}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:6px}
p,li{overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.nb{position:-webkit-sticky;position:sticky;top:0;z-index:7;display:flex;align-items:center;justify-content:center;
height:54px}
.nb a{position:absolute;left:16px;top:5px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;
border-radius:50%;color:#000;-webkit-tap-highlight-color:transparent}
.nb a:hover{text-decoration:none}.nb a:active{opacity:.6}
.nb i{flex:none;width:11px;height:19px;margin-left:-3px;background:currentColor;-webkit-mask:var(--back) center/11px 19px no-repeat;

.nb b{max-width:calc(100% - 136px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#000;
font:600 17px/22px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0}
.navfx{position:fixed;top:0;left:0;right:0;z-index:6;height:104px;pointer-events:none}

.navfx i:nth-child(5){background:linear-gradient(rgba(var(--fog),0.850) 42.0%,rgba(var(--fog),0.833) 46.8%,rgba(var(--fog),0.787) 51.7%,rgba(var(--fog),0.717) 56.5%,rgba(var(--fog),0.630) 61.3%,rgba(var(--fog),0.530) 66.2%,rgba(var(--fog),0.425) 71.0%,rgba(var(--fog),0.320) 75.8%,rgba(var(--fog),0.220) 80.7%,rgba(var(--fog),0.133) 85.5%,rgba(var(--fog),0.063) 90.3%,rgba(var(--fog),0.017) 95.2%,rgba(var(--fog),0.000) 100.0%)}
main.wrap{padding-top:16px;padding-bottom:64px}
h1{margin:0;font-weight:700;font-size:clamp(34px,8.6vw,48px);line-height:1.08;letter-spacing:-.028em}
h2{font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.018em}
.hero h1{font-size:clamp(40px,10.6vw,64px);line-height:1.05}
.grad{color:var(--link)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.grad{background:var(--grad);
-webkit-background-clip:text;background-clip:text;color:transparent}}
.lead{margin:18px 0 0;font-size:21px;line-height:1.38;color:var(--muted);letter-spacing:-.02em}
.lead.second{margin-top:10px;font-size:17px;line-height:1.47;letter-spacing:-.01em}
.sec{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:52px 0 20px;padding-bottom:8px;
border-bottom:1px solid var(--line)}
.sec h2{margin:0;font-size:28px;line-height:1.14;letter-spacing:-.022em}
.sec a{display:inline-flex;align-items:center;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:20px 0}
.card h2{margin:0 0 10px}
.card p{margin:0 0 14px}.card>:last-child{margin-bottom:0}
.list{padding:0;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:16px;min-height:52px;padding:12px 44px 12px 16px;
color:var(--text)}
.row:hover{text-decoration:none}.row:active{background:var(--press)}
@media (hover:hover){.row:hover{background:var(--press)}}
.row::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;margin-top:-5px;
border:solid var(--chev);border-width:2px 2px 0 0;transform:rotate(45deg)}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:92px;border-top:1px solid var(--line)}
.row img{flex:none;width:60px;height:60px;border-radius:13.5px;box-shadow:0 0 0 1px var(--ring)}
.row .t{display:flex;flex-direction:column;min-width:0}
.row strong{font-weight:600;line-height:1.3}
.row .t span{margin-top:2px;color:var(--muted);font-size:15px;line-height:1.35;letter-spacing:-.005em}
.links .row+.row::before{left:16px}
.checks{margin:0;padding:4px 20px;list-style:none}
.checks li{display:flex;gap:14px;align-items:flex-start;padding:14px 0}
.checks li+li{border-top:1px solid var(--line)}
.checks svg{flex:none;width:22px;height:22px;margin-top:1px;color:var(--link)}
.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;border-radius:980px;
font-size:17px;line-height:1.2;background:#0071e3;color:#fff}
.btn:hover{text-decoration:none}.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--link);box-shadow:inset 0 0 0 1px currentColor}
.app-hero .icon{display:block;width:112px;height:112px;border-radius:25px;margin:0 0 24px;
box-shadow:0 0 0 1px var(--ring),0 4px 16px rgba(0,0,0,.12)}
.app-hero h1 span{display:block;margin-top:8px;color:var(--muted);font-size:22px;font-weight:600;line-height:1.25;
letter-spacing:-.018em}
.app-hero .lead{color:var(--text);font-weight:600;font-size:19px;letter-spacing:-.015em;margin-top:16px}
.app-hero .promo{margin:12px 0 0;color:var(--muted)}
.app-hero+.card,.app-hero+.feat{margin-top:36px}
.feat h2{margin:0 0 12px}.feat .card{margin:0}
.legal{max-width:680px}
.legal h1{font-size:clamp(32px,8.2vw,44px)}
.legal h1+p{margin:12px 0 0;color:var(--muted);font-size:15px}
.legal h2{margin:40px 0 10px}.legal h3{font-size:17px;margin:24px 0 6px}
.legal p{margin:0 0 14px}.legal ul{margin:0 0 14px;padding-left:22px}.legal li{margin:8px 0}
.legal .card{margin:28px 0}.legal .card h2{margin-top:0}
.legal a.url{overflow-wrap:anywhere;-webkit-hyphens:none;hyphens:none}
.legal .group{padding:0}.legal .group section{padding:20px}
.legal .group section+section{border-top:1px solid var(--line)}
.legal .group h2{margin:0 0 8px;font-size:19px}.legal .group p:last-child{margin-bottom:0}
.legal section:not(.card)+.card,.legal h1+p+.card{margin-top:32px}

body:has(.ios){background:#f2f2f7;--fog:242,242,247}
main:has(.ios){max-width:none;padding:0}
.ios{max-width:600px;margin:0 auto;color:#000;letter-spacing:normal;

.ios a{color:#000;text-decoration:none}.ios a:hover{text-decoration:none}

.ios a,.ios button{-webkit-tap-highlight-color:transparent}

   #85858a bei x 32, 27,5 pt unter der Karte und 6 pt über der nächsten */
.ios .hd{margin-top:22.67px;padding:16.33px 16px 14.8px}

.ios .an{margin:13.3px 0 0;padding:0;color:#000;font:700 22px/28px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
letter-spacing:0}
.ios .ad{margin:2.9px 0 0;color:#7f7f7f;font:400 17px/22px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0}
.ios .sh{margin:0;padding:27.5px 32px 6.17px;color:#85858a;font:600 17px/22px -apple-system,BlinkMacSystemFont,sans-serif;

.ios .sf{margin:0;padding:7px 32px 0;color:#7f7f7f;font:400 13px/18px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0}

.ios .ft{height:auto;min-height:52px;padding-top:14px;padding-bottom:14px}
.ios .ft span{white-space:normal;padding-right:16px}
.ios .app{padding-bottom:40px}

body:has(.dev){background:#fff}
main:has(.dev){max-width:none;padding:0}
/* David 11.11.2026 21:2x: fester weisser Balken oben, 1:1 wie apps.apple.com (dort gemessen: position fixed, 44 px hoch,
   #fff, box-shadow 0 1px 2px rgba(0,0,0,.1)). Die zwei Menuelinien sitzen mittig darin und bleiben beim Scrollen stehen.
   Unter dem Menue (z-index 9999), ueber dem Inhalt; faengt Tipps ab, damit keine App darunter aufgeht. In der Mitte Apples Zeichen mit Schriftzug App Store (David 11.11.2026 23:4x, APPSTORE_CSS unten). */
body:has(.dev)::before{content:"";position:fixed;top:0;left:0;right:0;z-index:9998;height:calc(44px + env(safe-area-inset-top));
background:#fff;box-shadow:0 1px 2px 0 rgba(0,0,0,.1)}
body:has(.dev) .gn-menutrigger,body:has(.dev) .gn-menuback{top:calc(env(safe-area-inset-top) - 2px)}
/* Ecken-Regel (David 21:13): das D von David 22 Punkte unter dem Balken und 22 vom linken Rand. Auf Davids iPhone gemessen:
   7 px Abstand oben ergaben 14 Punkte bis zum D, also 44 + 15 = 59 px. */
.dev{max-width:600px;margin:0 auto;padding-bottom:40px;color:#000;letter-spacing:0;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}

letter-spacing:0}

.dev li:not(:last-child)::after{content:"";position:absolute;left:91.67px;right:19.67px;bottom:0;height:1px;background:#e7e7e7;
transform-origin:0 100%;pointer-events:none}
@media (-webkit-min-device-pixel-ratio:2),(min-resolution:2dppx){.dev li:not(:last-child)::after{transform:scaleY(.5)}}
@media (-webkit-min-device-pixel-ratio:3),(min-resolution:3dppx){.dev li:not(:last-child)::after{transform:scaleY(.3333)}}

.gn{position:absolute;top:0;left:0;right:0;z-index:9999;height:48px;
--sfd:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--sft:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--cb:cubic-bezier(.4,0,.6,1)}
.gn ul{list-style:none;margin:0;padding:0}
.gn-content{--rate:375ms;position:absolute;top:0;left:0;width:100%;height:48px;overflow:hidden;
background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
transition:height var(--rate) var(--cb) 80ms,background var(--rate) var(--cb) 80ms}
.gn-open .gn-content{height:100vh;height:100dvh;background:#fafafc;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;transition-delay:0ms}
.gn-menu,.gn-submenu{position:absolute;top:0;left:0;width:100%}
.gn-flyout{padding-top:50px;box-sizing:border-box}
.gn-menu-list{display:flex;flex-direction:column;padding-bottom:84px}
.gn-item{opacity:0;transform:translateY(-8px);
transition:opacity .24s var(--cb) calc(.2s + var(--n) * 20ms),transform .24s var(--cb) calc(.2s + var(--n) * 20ms)}
.gn-open .gn-item{opacity:1;transform:none}
.gn-closing .gn-item{transition-delay:0s;transition-duration:min(.16s + 20ms * (8 - var(--n)),.24s)}
.gn-sub .gn-item{transition:none}
.gn-sub:not(.gn-anim) .gn-item{opacity:0;visibility:hidden;transform:translate(-8px)}
.gn-item:first-child{margin-top:-3px}
.gn-link{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:-7px;padding:3px 48px 4px;
color:#333336;text-decoration:none;font-family:var(--sfd);font-size:28px;line-height:1.1428571429;font-weight:600;
letter-spacing:-.0066em;pointer-events:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-open .gn-link{pointer-events:auto}
.gn-link:hover,.gn-link:focus-visible{color:#000}
.gn-link:focus{outline:none}
.tasten .gn-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-link-text{pointer-events:none;padding-top:7.5px;padding-bottom:7.5px}
.gn-link-chevron{display:block;height:47px;margin-top:-1px;margin-right:-48px;padding-right:19px;color:#333336;
opacity:0;visibility:hidden;transform:scale(.8);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-link-chevron svg{fill:currentColor;transform:scaleX(-1) translateZ(0)}
@media (hover:hover){.gn-open:not(.gn-sub):not(.gn-closing) .gn-link:hover .gn-link-chevron{visibility:visible;
opacity:1;transform:none;transition:visibility .24s step-start;animation:gn-chevron-in .24s var(--cb) both}}
@keyframes gn-chevron-in{0%{opacity:0;transform:translate(-4px)}to{opacity:1;transform:translate(0)}}
.gn-submenu{opacity:0;visibility:hidden;pointer-events:none;overflow:hidden}
.gn-sub .gn-submenu{opacity:1;visibility:visible;pointer-events:auto}
.gn.gn-closing .gn-submenu{opacity:0;transform:translateY(-8px);transition:opacity .24s var(--cb),transform .24s var(--cb)}
.gn-submenu-content{display:flex;flex-wrap:wrap;padding:50px 48px 0;box-sizing:border-box}
.gn-submenu-group{padding-bottom:92px}
.gn-submenu-header{margin:0;color:#6e6e73;font-family:var(--sft);font-size:17px;line-height:1.2353641176;
font-weight:400;letter-spacing:.0033em}
.gn-submenu-list-item{margin:0 -11px;font-family:var(--sft);font-size:17px;line-height:1.4705882353;font-weight:600;
letter-spacing:-.022em}
.gn-submenu-list-item:first-child{margin-top:14px}
.gn-submenu-link{display:flex;align-items:center;max-width:max-content;padding:8px 11px 7px;margin-bottom:-5px;
color:#333336;text-decoration:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-submenu-link:hover,.gn-submenu-link:focus-visible{color:#000}
.gn-submenu-link:focus{outline:none}
.tasten .gn-submenu-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-ki{display:block;max-width:none;margin:0;padding:0 0 calc(48px + env(safe-area-inset-bottom));box-sizing:border-box;min-height:100vh;min-height:100dvh;--w:min(100vw,600px)}
.gn-ki-h{position:relative;pointer-events:none;--x:calc(var(--k) * var(--w) - .5px);margin:0 0 calc(0px - var(--x));padding:14px max(20px,calc(50% - 280px)) 0;background:linear-gradient(var(--von),var(--nach) calc(100% - var(--x)),transparent 0);color:#000;font:700 34px/41px var(--sfd);letter-spacing:0}
.gn-ki-h:first-of-type{padding-top:64px}
.gn-ki-titel{position:absolute;top:0;left:64px;right:64px;z-index:1;margin:0;color:#1d1d1f;font:600 17px/48px var(--sft);letter-spacing:-.4px;text-align:center;white-space:nowrap;pointer-events:none}
.gn-ki-a{display:block;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-ki-a img{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
.gn-fwd .gn-menu .gn-link-text{animation:gn-fwd-prev .24s var(--cb) both}
.gn-fwd .gn-submenu{animation:gn-fwd-next .24s var(--cb) .16s both}
.gn-bwd .gn-submenu{animation:gn-bwd-prev .24s var(--cb) both}
.gn-bwd .gn-menu .gn-link-text{animation:gn-bwd-next .24s var(--cb) .16s both}
@keyframes gn-fwd-next{0%{opacity:0;transform:translate(8px)}to{opacity:1;transform:translate(0)}}
@keyframes gn-fwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(-8px)}}
@keyframes gn-bwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(8px)}}
@keyframes gn-bwd-next{0%{opacity:0;transform:translate(-8px)}to{opacity:1;transform:translate(0)}}
.gn-menuback{position:absolute;top:0;left:max(0px,env(safe-area-inset-left) - 18px);z-index:3;width:48px;height:48px;
opacity:0;pointer-events:none;visibility:hidden;transform:translate(4px) scale(1);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-sub:not(.gn-bwd):not(.gn-closing) .gn-menuback{visibility:visible;transform:translate(0) scale(1);opacity:1;pointer-events:auto;
transition:opacity .24s var(--cb) .16s,transform .24s var(--cb) .16s,visibility .24s step-start .16s}
.gn.gn-closing .gn-menuback{opacity:0;transform:translate(0) scale(.8)}
.gn button:focus:not(:focus-visible){outline:none}
/* David 16.11.2026 12:0x: "Warum sind da manchmal bmaue boxenn drum? Geh sicher das die nicht mehr kommen". Das Menue setzt
   beim Wechsel ins KI-Untermenue und zurueck den Fokus per Skript, iOS zeigt dann einen blauen Rahmen. Rahmen nur noch bei
   Tab- oder Pfeiltasten (Klasse tasten am html, jeder Fingertipp nimmt sie weg). */
html:not(.tasten) .gn :focus{outline:none!important}
.gn-menuback-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;
padding:0;font:inherit;cursor:pointer;outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-menuback-button{display:flex;justify-content:center;width:100%;height:100%;color:#333336;transition:color .32s var(--cb)}
.gn-menuback-button:hover{color:#000}
.gn-chevron-icon{display:flex;margin-left:-1px}

.gn-page{--rate:375ms;position:fixed;pointer-events:none}
.gn-page a,.gn-page a:hover{text-decoration:none}
.gn-page .gn-content,.gn-page.gn-open .gn-content{height:100vh;height:100dvh;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
overflow:hidden;transition:none;pointer-events:none}
.gn-page.gn-open .gn-content{pointer-events:auto}
.gn-page.gn-fertig .gn-content{overflow-x:hidden;overflow-y:auto}
.gn-schleier,.gn-tuch{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;pointer-events:none}
.gn-schleier{background:rgb(232,232,237);opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb)}
.gn-page.gn-open .gn-schleier{opacity:1;transition:opacity .36s var(--cb) .1s}
.gn-tuch{transform:translate3d(0,-100%,0);will-change:transform;transition:transform var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-tuch{transform:translate3d(0,0,0);transition-delay:0ms}
.gn-glas,.gn-voll{position:absolute;top:0;right:0;bottom:0;left:0}
.gn-glas{background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.gn-voll{background:#fafafc;opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-voll{opacity:1;transition-delay:0ms}
.gn-page.gn-fertig .gn-glas{visibility:hidden}
.gn-page .gn-item{will-change:opacity,transform}
.gn-strich{position:absolute;left:50%;top:50%;width:24px;height:6px;margin:-3px 0 0 -12px;will-change:transform}
.gn-strich-oben{transform:translate(0,-4px)}
.gn-strich-unten{transform:translate(0,3px)}
.gn-open .gn-strich-oben{animation:gn-oben-auf .24s linear both}
.gn-open .gn-strich-unten{animation:gn-unten-auf .24s linear both}
.gn-closing .gn-strich-oben{animation:gn-oben-zu .24s linear both}
.gn-closing .gn-strich-unten{animation:gn-unten-zu .24s linear both}
.gn-menutrigger{position:absolute;top:3px;right:max(0px,env(safe-area-inset-right) - 16px);z-index:3;width:48px;pointer-events:auto}
.gn-menutrigger-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;padding:0;font:inherit;cursor:pointer;
outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0);position:relative;display:flex;justify-content:center;align-items:center;
width:48px;height:48px;color:#000;opacity:.8;transition:opacity .32s var(--cb),color .32s var(--cb)}
.gn-menutrigger-button:hover{opacity:1}

   graph)". Gemessen im Bild: #1d1d1f, 32 px halbfett (Großbuchstabe 22,3 hoch, wie SF Pro Display 600 bei 32), Grundlinie
   82 unter dem oberen Rand, Karte ab 120,33, Schrift links ab 26,33. Die Leiste mit "story" oben fällt weg (kopf="" in
   website.py). Nachgemessen in iOS-Safari (Simulator, 3x) mit demselben Satz "Entdecke alle Modelle.": mit 52 oben lag die
   Grundlinie bei 81,67 und der Satz war 322,67 statt 313,33 breit (Safaris Systemschrift sperrt bei 32 px je Buchstabe
   0,44 px weiter als Apples Webschrift, das E selbst ist gleich breit). Safari setzt die Grundlinie nur auf ganze
   Gerätepixel und rundet 52,33 noch auf 81,67 ab; mit 52,45 oben steht sie auf 82,0. Unten 31,88 (52,45 + 36 + 31,88 =
   120,33), Laufweite -0,316 px (0,128 - 9,33 / 21 Lücken). Links 16 + 9,46 + Fleisch des "s" = 26,33. Breite wie die
   Karte, damit beide auf großen Bildschirmen fluchten. */
.st-h{max-width:700px;margin:0 auto;padding:52.45px 0 31.88px 9.46px;box-sizing:border-box;color:#1d1d1f;

   die Grundlinie liegt also bei 71,7. Nachgemessen im Simulator-Safari (iPhone 17 Pro, 3x):
   "Storage" in dieser Schrift ohne Sperrung reicht wie im Bild von x 51 bis 224 (58,0 pt, S 38 px hoch), also Laufweite 0;

.st-hk{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:700px;margin:0 auto;

/* David 16.11.2026 12:2x, woertlich: "Mach die einzelnen Balken auf dem Grafen doppelt so dick, wie die jetzt gerade sind.
   Mach die Schrift daneben in Schwarz. Mach die komplette Tabelle darunter weg. Statt dieses grauen Bereichs, der sich
   öffnet, wenn man das aufklappt und wenn man drin ist, soll dann diese ganze Liste kommen, mit den bunten Quadraten davor
   von vorher." Dann 12:3x, woertlich: "Ich meinte, die Balken sollen 1,5-mal so dick sein, nicht zweimal so dick. Ich hab
   mich versprochen. Mach das 1,5 statt 2." Balken 108 % statt 72 % der alten Reihe, die Lücke dazwischen bleibt 28 %, der
   Graph wird dafür höher (Skript der Seite und hoehe in seite()); Namen #1d1d1f wie die Namen der Liste; die Liste steht
   nur noch im Blatt. */
.st-graph{-webkit-tap-highlight-color:transparent}
.st-graph [data-i]{cursor:pointer;outline:none}
.st-tasten .st-graph [data-i]:focus-visible rect+rect{stroke:#007afe;stroke-width:2px}

/* David 16.11.2026 13:1x zu fünf Entwürfen, wörtlich: "Alle 5 schlechter als jetzt. Das soll weiter so ein graph sein aber
   vom design her besser. Nicht extra text oder slides ider so. Und übergängen in den balken ist nicht schön". Zur zweiten
   Runde 13:2x, wörtlich: "Animation ist gut und strichel linie auch. Versuch die linien mal eckig statt rund zu machen mit
   verscheidenen leveln an abrundung für mich zum wählen", zu 0, 2, 4, 6 px und rund dann 13:3x: "Lass bei ganz gerundet".
   Seitdem gestrichelte Jahreslinien (#d1d1d6, 1 px, Strich 2, Lücke 3) hinter den Balken statt der Jahresstriche unter
   der Achse, wie in Apples Health-App; ein weißer Rand um jeden Namen, damit keine Linie durch Buchstaben läuft. Beim
   Öffnen wachsen die Balken (Skript: wachse()), beim Drücken wird der Balken sofort blasser (st-druck), Balken ganz rund. */
.st-graph text.st-bn{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}

/* Nur mit dem Speicherbalken (st-bh). David 16.11.2026 18:4x, mit Apples Fenster als Vorbild (20 pt grauer Streifen über der
   weißen Karte, graues X) und unserem gescrollten Minecraft-Fenster, woertlich: "Mach das das pop up soweit nach oben geht
   aber dafür soll das dann die balken scroll regel nicht mehr haben und wenn man scrollt soll das einfach nach unten weiter
   gehen statt pop up form zu behalten". Damit fallen "nur bis unter den Balken" (15:52) und die drei Scroll-Abschnitte (16:4x)
   weg: das Fenster ist die ganze Ebene über der Seite und selbst der Scrollbereich, die weiße Karte (st-inhalt) beginnt 20 px
   unter dem oberen Rand (ab 760 px Breite 680 px breit mit 24 px Rand) und läuft beim Scrollen mit ihren runden Ecken nach
   oben aus dem Bild, der Inhalt geht weiter wie eine Seite. Das X läuft oben rechts mit (st-xs, sticky wie bei Apple). Tipp
   auf den grauen Streifen schließt, Herunterziehen ganz oben auch. */
/* Kein Text mehr und kein Scrollen (David 18.11.2026 21:3x, wörtlich: „Okay, jetzt mach bei allen Bildern: Lass die Bilder genau so, wie sie sind, aber mach das darunter, den ganzen Text. Zum Beispiel bei Appel Dev: Da steht
   sowas wie „missing from the chart until bla bla bla“. All der Text, der da drunter ist, soll alles weg. Am Ende nur noch die
   Überschrift, das Datum, die Uhrzeit, das Bild und der ganz kleine Text, der graue Satz unter dem Bild, übrig. Und wenn man von
   einem Bild zum nächsten scrollt, dann rutscht man manchmal ab, einfach weil es nach unten scrollt. Also mach es, sobald du das
   alles weggemacht hast, so, dass man bei dem Pop-Up nicht hoch- oder unterscrollen kann, sondern nur von über dem Bild. Wenn man
   über dem Bild anfängt nach unten zu wischen, schließt sich dann das Pop-Up.“):
   Zeilen, Teile, Zitate und Belege kommen nicht mehr in die Seite (sie bleiben in belege.json); die zwei Balken und die Leiste
   bleiben. Fenster und Karte scrollen nicht (overflow hidden, touch-action none, auch auf Rahmen und Leiste: deren pan-y ließ
   Safari beim seitlichen Wischen senkrecht scrollen, das war das Abrutschen). Passt der Inhalt nicht in die Karte, wird nur der
   Bildrahmen kleiner, 4:3 und mittig (Skript: passeH); auf Davids iPhone (390 x 699 und 402 x 714) bleibt er über die ganze
   Breite. Reicht auch der kleinste Rahmen (160 px) nicht, etwa quer, wird der ganze Inhalt kleiner (scale), gescrollt wird nie.
   Wischen nach unten, das oberhalb des sichtbaren Bilds beginnt (bei breiten Bildern auch im Weiß darüber), zieht das Fenster
   mit und schließt es (Skript bei zlos); auf Bild und Leiste geht nur links und rechts. */
.st-blatt.st-bh{top:0;height:100%;border-radius:0;background:transparent;overflow:hidden;overscroll-behavior:none;touch-action:none}
.st-bh .st-inhalt{height:calc(100% - 20px);min-height:0;margin-top:20px;overflow:hidden;background:#fff;border-radius:18px 18px 0 0}
@media (min-width:760px){.st-blatt.st-bh{left:0;right:0;bottom:0;width:100%;margin-left:0;border-radius:0}
.st-bh .st-inhalt{width:680px;height:calc(100% - 48px);min-height:0;margin:24px auto;border-radius:18px}}
.st-xs{position:sticky;top:0;z-index:3;height:0}

   (Schleifen stumm und endlos), nochmal Tippen hält es an, Wischen, Wechsel der Idee oder Schließen beendet es.

   am Rand (die Leiste blendet 20 px vor dem Rand aus) und haben die Ecke immer, als Maske für 20 x 30 und 30 x 30 (--m0, --m1

   Bild, Grau 241 auf dem Weiß 254 des Bilds, also Schwarz mit 5 % Deckkraft (auf dunklen Bildern kaum zu sehen, wie in Fotos).
   Gemalt als Strich entlang derselben Form wie der Zuschnitt, 2 px breit und auf die Form beschnitten, damit genau 1 px innen
   bleibt. Form und Größe setzt mass() (--ra, --rw, --rh), für die kleinen Bilder stehen --r0 und --r1 an der Leiste. Bilder über

.st-lk{position:relative}

   höchstens 300 px, dann 0,3 s ease, also höchstens ein Drittel der Strecke. Skript: gleite und rast in wisch(). */
