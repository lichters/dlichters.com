<style>
:root{color-scheme:light;--bg:#fff;--bar:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
--link:#0071e3;--chev:#aeaeb2;--ring:rgba(0,0,0,.1);--press:#f5f5f7;
--grad:linear-gradient(96deg,#0071e3 0%,#5e5ce6 52%,#9b3fd6 100%);
--fbg:#f1f1f1;--fcopy:#4c4c4c;--fline:#e5e5e5;--flogo:#9292a1;--flink:#0066cc;--fog:255,255,255}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",
"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
display:flex;flex-direction:column;min-height:100vh}
body>main{flex:1 0 auto;width:100%}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:6px}
p,li{overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.nb{position:-webkit-sticky;position:sticky;top:0;z-index:7;display:flex;align-items:center;justify-content:center;
height:54px}
.nb a{position:absolute;left:16px;top:5px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;
border-radius:50%;color:#000;-webkit-tap-highlight-color:transparent}
.nb a:hover{text-decoration:none}.nb a:active{opacity:.6}
.nb i{flex:none;width:11px;height:19px;margin-left:-3px;background:currentColor;-webkit-mask:var(--back) center/11px 19px no-repeat;
mask:var(--back) center/11px 19px no-repeat}
.nb b{max-width:calc(100% - 136px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#000;
font:600 17px/22px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0}
.navfx{position:fixed;top:0;left:0;right:0;z-index:6;height:104px;pointer-events:none}

.navfx i:nth-child(4){-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(rgba(0,0,0,1.000) 0.0%,rgba(0,0,0,0.926) 6.7%,rgba(0,0,0,0.741) 13.3%,rgba(0,0,0,0.500) 20.0%,rgba(0,0,0,0.259) 26.7%,rgba(0,0,0,0.074) 33.3%,rgba(0,0,0,0.000) 40.0%);mask-image:linear-gradient(rgba(0,0,0,1.000) 0.0%,rgba(0,0,0,0.926) 6.7%,rgba(0,0,0,0.741) 13.3%,rgba(0,0,0,0.500) 20.0%,rgba(0,0,0,0.259) 26.7%,rgba(0,0,0,0.074) 33.3%,rgba(0,0,0,0.000) 40.0%)}
.navfx i:nth-child(5){background:linear-gradient(rgba(var(--fog),0.850) 42.0%,rgba(var(--fog),0.833) 46.8%,rgba(var(--fog),0.787) 51.7%,rgba(var(--fog),0.717) 56.5%,rgba(var(--fog),0.630) 61.3%,rgba(var(--fog),0.530) 66.2%,rgba(var(--fog),0.425) 71.0%,rgba(var(--fog),0.320) 75.8%,rgba(var(--fog),0.220) 80.7%,rgba(var(--fog),0.133) 85.5%,rgba(var(--fog),0.063) 90.3%,rgba(var(--fog),0.017) 95.2%,rgba(var(--fog),0.000) 100.0%)}
main.wrap{padding-top:16px;padding-bottom:64px}
h1{margin:0;font-weight:700;font-size:clamp(34px,8.6vw,48px);line-height:1.08;letter-spacing:-.028em}
h2{font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.018em}
.hero h1{font-size:clamp(40px,10.6vw,64px);line-height:1.05}
.grad{color:var(--link)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.grad{background:var(--grad);
-webkit-background-clip:text;background-clip:text;color:transparent}}
.lead{margin:18px 0 0;font-size:21px;line-height:1.38;color:var(--muted);letter-spacing:-.02em}
.lead.second{margin-top:10px;font-size:17px;line-height:1.47;letter-spacing:-.01em}
.sec{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:52px 0 20px;padding-bottom:8px;
border-bottom:1px solid var(--line)}
.sec h2{margin:0;font-size:28px;line-height:1.14;letter-spacing:-.022em}
.sec a{display:inline-flex;align-items:center;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:20px 0}
.card h2{margin:0 0 10px}
.card p{margin:0 0 14px}.card>:last-child{margin-bottom:0}
.list{padding:0;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:16px;min-height:52px;padding:12px 44px 12px 16px;
color:var(--text)}
.row:hover{text-decoration:none}.row:active{background:var(--press)}
@media (hover:hover){.row:hover{background:var(--press)}}
.row::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;margin-top:-5px;
border:solid var(--chev);border-width:2px 2px 0 0;transform:rotate(45deg)}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:92px;border-top:1px solid var(--line)}
.row img{flex:none;width:60px;height:60px;border-radius:13.5px;box-shadow:0 0 0 1px var(--ring)}
.row .t{display:flex;flex-direction:column;min-width:0}
.row strong{font-weight:600;line-height:1.3}
.row .t span{margin-top:2px;color:var(--muted);font-size:15px;line-height:1.35;letter-spacing:-.005em}
.links .row+.row::before{left:16px}
.checks{margin:0;padding:4px 20px;list-style:none}
.checks li{display:flex;gap:14px;align-items:flex-start;padding:14px 0}
.checks li+li{border-top:1px solid var(--line)}
.checks svg{flex:none;width:22px;height:22px;margin-top:1px;color:var(--link)}
.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;border-radius:980px;
font-size:17px;line-height:1.2;background:#0071e3;color:#fff}
.btn:hover{text-decoration:none}.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--link);box-shadow:inset 0 0 0 1px currentColor}
.app-hero .icon{display:block;width:112px;height:112px;border-radius:25px;margin:0 0 24px;
box-shadow:0 0 0 1px var(--ring),0 4px 16px rgba(0,0,0,.12)}
.app-hero h1 span{display:block;margin-top:8px;color:var(--muted);font-size:22px;font-weight:600;line-height:1.25;
letter-spacing:-.018em}
.app-hero .lead{color:var(--text);font-weight:600;font-size:19px;letter-spacing:-.015em;margin-top:16px}
.app-hero .promo{margin:12px 0 0;color:var(--muted)}
.app-hero+.card,.app-hero+.feat{margin-top:36px}
.feat h2{margin:0 0 12px}.feat .card{margin:0}
.legal{max-width:680px}
.legal h1{font-size:clamp(32px,8.2vw,44px)}
.legal h1+p{margin:12px 0 0;color:var(--muted);font-size:15px}
.legal h2{margin:40px 0 10px}.legal h3{font-size:17px;margin:24px 0 6px}
.legal p{margin:0 0 14px}.legal ul{margin:0 0 14px;padding-left:22px}.legal li{margin:8px 0}
.legal .card{margin:28px 0}.legal .card h2{margin-top:0}
.legal a.url{overflow-wrap:anywhere;-webkit-hyphens:none;hyphens:none}
.legal .group{padding:0}.legal .group section{padding:20px}
.legal .group section+section{border-top:1px solid var(--line)}
.legal .group h2{margin:0 0 8px;font-size:19px}.legal .group p:last-child{margin-bottom:0}
.legal section:not(.card)+.card,.legal h1+p+.card{margin-top:32px}

body:has(.ios){background:#f2f2f7;--fog:242,242,247}
main:has(.ios){max-width:none;padding:0}
.ios{max-width:600px;margin:0 auto;color:#000;letter-spacing:normal;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
.ios a{color:#000;text-decoration:none}.ios a:hover{text-decoration:none}
.ios .grp{margin:0 16px;background:#fff;border-radius:26px;overflow:hidden}
.ios .grp+.grp{margin-top:35px}

.ios a,.ios button{-webkit-tap-highlight-color:transparent}
/* App-Seite wie die Einstellungen-Seite „Accessibility“ (Davids Bild, 26.10.2026, 3 px je pt gemessen): Karte 22,67 pt
   unter der Leiste, Symbol 60 pt, Name 22 pt fett, Beschreibung 17/22 pt in #7f7f7f; Abschnittstitel 17 pt halbfett
   #85858a bei x 32, 27,5 pt unter der Karte und 6 pt über der nächsten */
.ios .hd{margin-top:22.67px;padding:16.33px 16px 14.8px}

.ios .an{margin:13.3px 0 0;padding:0;color:#000;font:700 22px/28px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
letter-spacing:0}
.ios .ad{margin:2.9px 0 0;color:#7f7f7f;font:400 17px/22px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0}
.ios .sh{margin:0;padding:27.5px 32px 6.17px;color:#85858a;font:600 17px/22px -apple-system,BlinkMacSystemFont,sans-serif;
letter-spacing:0}
.ios .sf{margin:0;padding:7px 32px 0;color:#7f7f7f;font:400 13px/18px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0}
.ios .sf a{color:#0088ff}
.ios .ft{height:auto;min-height:52px;padding-top:14px;padding-bottom:14px}
.ios .ft span{white-space:normal;padding-right:16px}
.ios .app{padding-bottom:40px}

body:has(.dev){background:#fff}
main:has(.dev){max-width:none;padding:0}
/* David 11.11.2026 21:2x: fester weisser Balken oben, 1:1 wie apps.apple.com (dort gemessen: position fixed, 44 px hoch,
   #fff, box-shadow 0 1px 2px rgba(0,0,0,.1)). Die zwei Menuelinien sitzen mittig darin und bleiben beim Scrollen stehen.
   Unter dem Menue (z-index 9999), ueber dem Inhalt; faengt Tipps ab, damit keine App darunter aufgeht. In der Mitte Apples Zeichen mit Schriftzug App Store (David 11.11.2026 23:4x, APPSTORE_CSS unten). */
body:has(.dev)::before{content:"";position:fixed;top:0;left:0;right:0;z-index:9998;height:calc(44px + env(safe-area-inset-top));
background:#fff;box-shadow:0 1px 2px 0 rgba(0,0,0,.1)}
body:has(.dev) .gn-menutrigger,body:has(.dev) .gn-menuback{top:calc(env(safe-area-inset-top) - 2px)}
/* Ecken-Regel (David 21:13): das D von David 22 Punkte unter dem Balken und 22 vom linken Rand. Auf Davids iPhone gemessen:
   7 px Abstand oben ergaben 14 Punkte bis zum D, also 44 + 15 = 59 px. */
.dev{max-width:600px;margin:0 auto;padding-bottom:40px;color:#000;letter-spacing:0;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}

letter-spacing:0}

.dev li:not(:last-child)::after{content:"";position:absolute;left:91.67px;right:19.67px;bottom:0;height:1px;background:#e7e7e7;
transform-origin:0 100%;pointer-events:none}

@media (-webkit-min-device-pixel-ratio:3),(min-resolution:3dppx){.dev li:not(:last-child)::after{transform:scaleY(.3333)}}

.gn{position:absolute;top:0;left:0;right:0;z-index:9999;height:48px;

.gn-sub .gn-item{transition:none}

.gn-item:first-child{margin-top:-3px}
.gn-link{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:-7px;padding:3px 48px 4px;
color:#333336;text-decoration:none;font-family:var(--sfd);font-size:28px;line-height:1.1428571429;font-weight:600;

.gn-open .gn-link{pointer-events:auto}

.gn-link-text{pointer-events:none;padding-top:7.5px;padding-bottom:7.5px}

opacity:0;visibility:hidden;transform:scale(.8);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-link-chevron svg{fill:currentColor;transform:scaleX(-1) translateZ(0)}
@media (hover:hover){.gn-open:not(.gn-sub):not(.gn-closing) .gn-link:hover .gn-link-chevron{visibility:visible;

@keyframes gn-chevron-in{0%{opacity:0;transform:translate(-4px)}to{opacity:1;transform:translate(0)}}

.gn-submenu-group{padding-bottom:92px}

.gn-submenu-list-item{margin:0 -11px;font-family:var(--sft);font-size:17px;line-height:1.4705882353;font-weight:600;

.gn-submenu-list-item:first-child{margin-top:14px}
.gn-submenu-link{display:flex;align-items:center;max-width:max-content;padding:8px 11px 7px;margin-bottom:-5px;
color:#333336;text-decoration:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-submenu-link:hover,.gn-submenu-link:focus-visible{color:#000}
.gn-submenu-link:focus{outline:none}
.gn-submenu-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-ki{display:block;max-width:none;margin:0;padding:0 0 calc(48px + env(safe-area-inset-bottom));box-sizing:border-box;min-height:100vh;min-height:100dvh;--w:min(100vw,600px)}

.gn-fwd .gn-menu .gn-link-text{animation:gn-fwd-prev .24s var(--cb) both}
