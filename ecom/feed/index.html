<title>Ecommerce Playbook</title>

<style>.gn{position:absolute;top:0;left:0;right:0;z-index:9999;height:48px;
--sfd:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--sft:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--cb:cubic-bezier(.4,0,.6,1)}
.gn ul{list-style:none;margin:0;padding:0}
.gn-content{--rate:375ms;position:absolute;top:0;left:0;width:100%;height:48px;overflow:hidden;
background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
transition:height var(--rate) var(--cb) 80ms,background var(--rate) var(--cb) 80ms}
.gn-open .gn-content{height:100vh;height:100dvh;background:#fafafc;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;transition-delay:0ms}
.gn-menu,.gn-submenu{position:absolute;top:0;left:0;width:100%}
.gn-flyout{padding-top:50px;box-sizing:border-box}
.gn-menu-list{display:flex;flex-direction:column;padding-bottom:84px}
.gn-item{opacity:0;transform:translateY(-8px);
transition:opacity .24s var(--cb) calc(.2s + var(--n) * 20ms),transform .24s var(--cb) calc(.2s + var(--n) * 20ms)}
.gn-open .gn-item{opacity:1;transform:none}
.gn-closing .gn-item{transition-delay:0s;transition-duration:min(.16s + 20ms * (8 - var(--n)),.24s)}
.gn-sub .gn-item{transition:none}
.gn-sub:not(.gn-anim) .gn-item{opacity:0;visibility:hidden;transform:translate(-8px)}
.gn-item:first-child{margin-top:-3px}
.gn-link{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:-7px;padding:3px 48px 4px;
color:#333336;text-decoration:none;font-family:var(--sfd);font-size:28px;line-height:1.1428571429;font-weight:600;
letter-spacing:-.0066em;pointer-events:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-open .gn-link{pointer-events:auto}
.gn-link:hover,.gn-link:focus-visible{color:#000}
.gn-link:focus{outline:none}
.gn-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-link-text{pointer-events:none;padding-top:7.5px;padding-bottom:7.5px}
.gn-link-chevron{display:block;height:47px;margin-top:-1px;margin-right:-48px;padding-right:19px;color:#333336;
opacity:0;visibility:hidden;transform:scale(.8);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-link-chevron svg{fill:currentColor;transform:scaleX(-1) translateZ(0)}
@media (hover:hover){.gn-open:not(.gn-sub):not(.gn-closing) .gn-link:hover .gn-link-chevron{visibility:visible;
opacity:1;transform:none;transition:visibility .24s step-start;animation:gn-chevron-in .24s var(--cb) both}}
@keyframes gn-chevron-in{0%{opacity:0;transform:translate(-4px)}to{opacity:1;transform:translate(0)}}
.gn-submenu{opacity:0;visibility:hidden;pointer-events:none;overflow:hidden}
.gn-sub .gn-submenu{opacity:1;visibility:visible;pointer-events:auto}
.gn.gn-closing .gn-submenu{opacity:0;transform:translateY(-8px);transition:opacity .24s var(--cb),transform .24s var(--cb)}
.gn-submenu-content{display:flex;flex-wrap:wrap;padding:50px 48px 0;box-sizing:border-box}
.gn-submenu-group{padding-bottom:92px}
.gn-submenu-header{margin:0;color:#6e6e73;font-family:var(--sft);font-size:17px;line-height:1.2353641176;
font-weight:400;letter-spacing:.0033em}
.gn-submenu-list-item{margin:0 -11px;font-family:var(--sft);font-size:17px;line-height:1.4705882353;font-weight:600;
letter-spacing:-.022em}
.gn-submenu-list-item:first-child{margin-top:14px}
.gn-submenu-link{display:flex;align-items:center;max-width:max-content;padding:8px 11px 7px;margin-bottom:-5px;
color:#333336;text-decoration:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-submenu-link:hover,.gn-submenu-link:focus-visible{color:#000}
.gn-submenu-link:focus{outline:none}
.gn-submenu-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-ki{display:block;max-width:none;margin:0;padding:0 0 calc(48px + env(safe-area-inset-bottom));box-sizing:border-box;min-height:100vh;min-height:100dvh;--w:min(100vw,600px)}
.gn-ki-h{position:relative;pointer-events:none;--x:calc(var(--k) * var(--w) - .5px);margin:0 0 calc(0px - var(--x));padding:14px max(20px,calc(50% - 280px)) 0;background:linear-gradient(var(--von),var(--nach) calc(100% - var(--x)),transparent 0);color:#000;font:700 34px/41px var(--sfd);letter-spacing:0}
.gn-ki-h:first-of-type{padding-top:64px}
.gn-ki-titel{position:absolute;top:0;left:64px;right:64px;z-index:1;margin:0;color:#1d1d1f;font:600 17px/48px var(--sft);letter-spacing:-.4px;text-align:center;white-space:nowrap;pointer-events:none}
.gn-ki-a{display:block;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-ki-a img{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
.gn-fwd .gn-menu .gn-link-text{animation:gn-fwd-prev .24s var(--cb) both}
.gn-fwd .gn-submenu{animation:gn-fwd-next .24s var(--cb) .16s both}
.gn-bwd .gn-submenu{animation:gn-bwd-prev .24s var(--cb) both}
.gn-bwd .gn-menu .gn-link-text{animation:gn-bwd-next .24s var(--cb) .16s both}
@keyframes gn-fwd-next{0%{opacity:0;transform:translate(8px)}to{opacity:1;transform:translate(0)}}
@keyframes gn-fwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(-8px)}}
@keyframes gn-bwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(8px)}}
@keyframes gn-bwd-next{0%{opacity:0;transform:translate(-8px)}to{opacity:1;transform:translate(0)}}
.gn-menuback{position:absolute;top:0;left:max(0px,env(safe-area-inset-left) - 18px);z-index:3;width:48px;height:48px;
opacity:0;pointer-events:none;visibility:hidden;transform:translate(4px) scale(1);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-sub:not(.gn-bwd):not(.gn-closing) .gn-menuback{visibility:visible;transform:translate(0) scale(1);opacity:1;pointer-events:auto;
transition:opacity .24s var(--cb) .16s,transform .24s var(--cb) .16s,visibility .24s step-start .16s}
.gn.gn-closing .gn-menuback{opacity:0;transform:translate(0) scale(.8)}
.gn button:focus:not(:focus-visible){outline:none}
.gn-menuback-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;
padding:0;font:inherit;cursor:pointer;outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-menuback-button{display:flex;justify-content:center;width:100%;height:100%;color:#333336;transition:color .32s var(--cb)}
.gn-menuback-button:hover{color:#000}
.gn-chevron-icon{display:flex;margin-left:-1px}
.gn-chevron-icon svg{fill:currentColor}

.gn-page{--rate:375ms;position:fixed;pointer-events:none}
.gn-page a,.gn-page a:hover{text-decoration:none}
.gn-page .gn-content,.gn-page.gn-open .gn-content{height:100vh;height:100dvh;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
overflow:hidden;transition:none;pointer-events:none}
.gn-page.gn-open .gn-content{pointer-events:auto}
.gn-page.gn-fertig .gn-content{overflow-x:hidden;overflow-y:auto}
.gn-schleier,.gn-tuch{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;pointer-events:none}
.gn-schleier{background:rgb(232,232,237);opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb)}
.gn-page.gn-open .gn-schleier{opacity:1;transition:opacity .36s var(--cb) .1s}
.gn-tuch{transform:translate3d(0,-100%,0);will-change:transform;transition:transform var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-tuch{transform:translate3d(0,0,0);transition-delay:0ms}
.gn-glas,.gn-voll{position:absolute;top:0;right:0;bottom:0;left:0}
.gn-glas{background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.gn-voll{background:#fafafc;opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-voll{opacity:1;transition-delay:0ms}
.gn-page.gn-fertig .gn-glas{visibility:hidden}
.gn-page .gn-item{will-change:opacity,transform}
.gn-strich{position:absolute;left:50%;top:50%;width:24px;height:6px;margin:-3px 0 0 -12px;will-change:transform}
.gn-strich-oben{transform:translate(0,-4px)}
.gn-strich-unten{transform:translate(0,3px)}
.gn-open .gn-strich-oben{animation:gn-oben-auf .24s linear both}
.gn-open .gn-strich-unten{animation:gn-unten-auf .24s linear both}
.gn-closing .gn-strich-oben{animation:gn-oben-zu .24s linear both}
.gn-closing .gn-strich-unten{animation:gn-unten-zu .24s linear both}
.gn-menutrigger{position:absolute;top:3px;right:max(0px,env(safe-area-inset-right) - 16px);z-index:3;width:48px;pointer-events:auto}
.gn-menutrigger-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;padding:0;font:inherit;cursor:pointer;
outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0);position:relative;display:flex;justify-content:center;align-items:center;
width:48px;height:48px;color:#000;opacity:.8;transition:opacity .32s var(--cb),color .32s var(--cb)}
.gn-menutrigger-button:hover{opacity:1}
html.gn-lock,html.gn-lock body{overflow:hidden}
html.srch .gn{display:none}

:root{--fg:#1d1d1f;--mut:#6e6e73;--strich:#808080;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;background:#fff;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
#feed,#svf{max-width:560px;margin:0 auto;padding:79px 0 40px}
.p{margin:0 0 47.04px}
.ph{display:flex;align-items:flex-start;height:32px;padding-left:10.7px}
.av{position:relative;display:block;flex:none;width:32px;height:32px;border-radius:50%;background:#fff}
.rg{position:absolute;left:0;top:0;width:32px;height:32px;overflow:visible;fill:none;stroke:rgba(0,0,0,.16);stroke-width:.5;pointer-events:none}
.av img{display:block;width:32px;height:32px;border-radius:50%}
.who{position:relative;flex:1;height:32px;margin-left:9.3px;min-width:0}
.nm{position:absolute;top:-.21px;left:0;font-size:13.8px;line-height:17px;font-weight:600;letter-spacing:0;color:var(--fg);white-space:nowrap}
.sp{position:absolute;top:18.28px;left:0;font-size:11.6px;line-height:14px;text-decoration:none;color:var(--fg)}
/* David 09.11.: Linie direkt ueber und unter jeder Slide, damit weisse Slides sich vom Hintergrund abheben. Exakt so dick wie die 2 Striche oben rechts: die sind 4 Bildpunkte hoch (3-fach gemessen 92, 51, 51, 92). Rahmen werden auf ganze Bildpunkte abgerundet, 1,34 ergibt bei 3-fach immer genau 4, bei jedem Post gleich. Farbe genau 50 Prozent Schwarz und 50 Prozent Weiss (David 09.11.). Die Slide selbst und alles darum bleibt, wo es war, die Linie liegt in der freien Luecke. */
.c{position:relative;margin-top:calc(9.67px - 1.34px);border-top:1.34px solid var(--strich);border-bottom:1.34px solid var(--strich);background:#b3b3b4;container-type:inline-size}
.c::before{content:"";display:block;padding-top:75%}
.cr{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.cr::-webkit-scrollbar{display:none}
.s{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#b3b3b4;color:#1d1d1f;padding:0 5.6%;container-type:inline-size}
.s .b{font-size:6.107vw;line-height:1.22;letter-spacing:-.012em;width:100%}
@supports (font-size:1cqw){.s .b{font-size:6.876cqw}}
.s h3{font:inherit;font-weight:600;margin:0 0 .5em}
.s p{margin:0 0 .5em}.s p:last-child{margin-bottom:0}
.s b{font-weight:600}
.s .tl{font-weight:600;font-size:1.25em;line-height:1.15;letter-spacing:-.018em}
.s .tl.m{font-size:1em;line-height:1.22;letter-spacing:-.012em}
.s .kl{display:block;font-size:.66em;line-height:1.3;font-weight:400;color:#1d1d1f;letter-spacing:0}
.s .kl:first-child{margin-bottom:.8em}.s .kl:last-child{margin-top:.8em}
/* Neues Slide-Design (David 10.11.: "Bau die Slides genau so"): Slides mit der Klasse n zeichnet slideNeu() aus ecom_slides.js, alle Masse stehen dort inline wie in Davids Vorlage. Hier wird nur zurueckgesetzt, was die alten Regeln von .s und der Seite sonst hineintragen wuerden (Flex-Kasten, Rand, Mitte, Grau, Kastenmass). Gemessen wird das von ecom_slides_pruefen.sh: jedes Element liegt wie in der Vorlage. */
.s.n{display:block;padding:0;text-align:left;background:#fff;color:#111;line-height:normal;letter-spacing:normal;font-size:16px;font-weight:400}
.s.n *{box-sizing:content-box}
/* System aus Davids Bildern (09.11., 3-fach gemessen): 1/5 bis 5/5 sind alle 101,9 x 77,5 Bildpunkte, Schrift mittig; 1/13 ist 109 breit. Das passt nur so:
   feste Mindestbreite 33,97 pt fuer kurze Zahlen, darueber Textbreite plus fester Rand 7,17 pt je Seite. Volle Kapsel, rechte Kante bleibt stehen. Alles waechst mit der Slide-Breite. */
.pl{position:absolute;top:14.4px;right:14.4px;min-width:33.97px;height:25.8px;padding:0 7.17px;border-radius:12.9px;background:rgba(45,45,45,.54);color:#fff;font-size:11.7px;line-height:25.8px;text-align:center;white-space:nowrap;pointer-events:none;z-index:2}
@supports (font-size:1cqw){.pl{top:3.664cqw;right:3.664cqw;min-width:8.643cqw;height:6.565cqw;padding:0 1.824cqw;border-radius:3.282cqw;font-size:2.98cqw;line-height:6.565cqw}}
.pf{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;font-size:18px;line-height:1;color:#1d1d1f}
.pf.l{left:10px}.pf.r{right:10px}
@media (hover:hover) and (pointer:fine){.c:hover .pf{display:flex}.c .pf[hidden]{display:none}}
.ic{position:relative;height:35.4px;margin-top:-1.34px}
.ic button,.ic a{position:absolute;display:block}
.ic svg{position:absolute;display:block;overflow:visible;fill:none;stroke:#1d1d1f;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.ic .pkt{fill:#1d1d1f;stroke:none}
.ic svg.ih{width:21.4px;height:19.8px}
.ic svg.ii{width:21.8px;height:21.8px}
.ic svg.is{width:19.2px;height:24px}
.ic svg.im{width:14.667px;height:23px}
/* Tippflaechen 44 pt, das Symbol sitzt genau wie in Davids Bild */
.ic .bl{left:2.6px;top:2.6px;width:44px;height:44px}.ic .bl svg{left:10.7px;top:11.4px}
.ic .bi{left:56.67px;top:2px;width:44px;height:44px}.ic .bi svg{left:10.9px;top:11.33px}
.ic .bs{left:109.99px;top:0;width:44px;height:44px}.ic .bs svg{left:12.6px;top:10.33px}/* Luecke zwischen den Symbolen genau 99 Bildpunkte bei 3-fach wie in beiden Bildern von David (gemessen 98, 99 und 99, 99), echte Zahl statt Verhaeltnis (David 09.11.) */
.ic .bm{right:2px;top:1px;width:44px;height:44px}.ic .bm svg{left:14.667px;top:10.83px}
.bl.on svg{fill:#1d1d1f;stroke:#1d1d1f}

function sichtbar(sl){if(sl.k==='n')return sl.x||'';if(sl.k==='t')return sl.t;return klar((sl.h?sl.h+'\n':'')+sl.t)}

/* Neues Slide-Design (David 10.11.: "Bau die Slides genau so"): slideNeu(sl,basis) zeichnet eine Slide mit k 'n' genau wie Davids Vorlage.
   Der Text darunter ist die Datei ecom_slides.js, unveraendert eingesetzt; ecom_slides_test.py vergleicht sie Byte fuer Byte mit der Vorlage. */
/* ecom_slides.js: zeichnet EINE Slide im neuen Design des Kurs-Feeds (dlichters.com/ecom/feed).

   Vorlage: ~/kurs/slides/vorlage/reference.html (Davids Design-Canvas, Regeln in README.md daneben).
   slideNeu(sl, basis) gibt den Container der Vorlage als HTML-Text zurueck, Byte fuer Byte gleich, nur mit
   voller Breite und Hoehe statt 400 x 300 px. Alle Stile stehen inline, alle Masse in cqw.
   Richter ist ecom_slides_test.py: die 43 Slides der Vorlage muessen gleich herauskommen.

   Dieselbe Datei laeuft an zwei Orten: im script-Block der Feed-Seite (danach gibt es genau EINEN neuen Namen,
   slideNeu) und unter node (module.exports). Nur altes JavaScript: var, function, Text verbinden.
   Die Datei enthaelt kein Prozentzeichen (dafuer String.fromCharCode(37)), kein schliessendes script-Tag und
   keine langen Striche. So passt sie unveraendert in die Seite und auch in einen Python-Formatstring.

   sl = kurze Slide-Form aus ecom_slides.py, immer mit k:'n' und y:Art:
     start      c Kapitel, t Titel, s Untertitel, i Bild        end       i Bild
     story      n Einleitung (freiwillig), m [[Name, Text], ...]
     term, statement, risk, check, remember                      h Kopf (freiwillig), t Text
     quiz       q Frage, o [3 Antworten], a Nummer der richtigen (wird hier nicht gezeigt)
     compare    h Kopf, bx [[Begriff, Erklaerung], [Begriff, Erklaerung]]
     steps      h Kopf, st [Schritte]                            list      h Kopf, it [Punkte], f Schluss (freiwillig)
     section    t Text                                           numbers   h Kopf, ca [[Zahl, Beschriftung], ...]
   basis = Adresse vor dem Bild: src ist basis + sl.i.

   Auf der Seite gehoert die Slide in einen Kasten mit fester Groesse im Format 4:3, als Block, ohne Innenabstand
   und linksbuendig (im Feed etwa .s.n{display:block;padding:0;text-align:left}). So gemessen am 10.11.2026 im
   Feed-Aufbau: jedes der 355 Elemente der 43 Vorlage-Slides liegt am selben Ort wie in reference.html.
   Alle Groessen sind cqw wie in der Vorlage: ein Browser ohne Container-Einheiten zeigt sie nicht richtig.

   Regeln (aus der Vorlage gemessen):
   - Textarten: Woerter von Kopf plus Text zaehlen (ohne Etikett, ohne **). Bis 14 Woerter 6.2cqw mit
     Zeilenhoehe 1.18, sonst 4.8cqw mit 1.28.
   - Reicher Text (**fett** und Geldbetraege orange) nur dort, wo die Vorlage ihn hat: Kopf und Text der
     Textarten, Kopf von compare und steps, Punkte und Schluss von list. Ueberall sonst schlichter Text,
     ein ** wird dort entfernt und nie gezeigt.
   - Geld: Dollarzeichen plus Zahl, Tausender-Kommas, Dezimalstellen, k oder M, Plus, auch "X to Y" als ein
     Stueck. Ein Komma direkt dahinter gehoert dazu (so steht es in der Vorlage), ein Punkt am Satzende nicht.
     Auf der orangen Merksatz-Slide ist der Betrag weiss und fett, orange auf orange waere unsichtbar.
   - Story: David rechts in Gruen, alle anderen links in Dunkelgrau. Die Namenszeile steht nur, wenn der
     Sprecher ein anderer ist als bei der Nachricht davor.
   - Zeichen: &, < und > werden zu Entities. Anfuehrungszeichen und Apostrophe bleiben im Text, wie sie sind
     (die Vorlage schreibt Apostrophe direkt). Nur in der Bildadresse wird " zu &quot;. */
function slideNeu(sl, basis) {
  var P = String.fromCharCode(37);
  var VOLL = 'width: 100' + P + '; height: 100' + P;
  var PFEIL = String.fromCharCode(8594);
  var ORANGE = '#C2410C';
  var KASTEN = '<div style="position: relative; ' + VOLL + '; flex: 0 0 auto; container-type: inline-size; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, \'SF Pro Display\', \'SF Pro Text\', \'Helvetica Neue\', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; ';
  var WEISS = 'background: #FFFFFF; color: #111111">';
  var INNEN = '<div style="position: absolute; inset: 0; box-sizing: border-box; padding: 6cqw 7cqw; display: flex; flex-direction: column; justify-content: center; align-items: stretch">';
  var BLOCK = '<div style="display: flex; flex-direction: column; gap: 2.4cqw">';
  var ABSATZ = '<p style="margin: 0; font-size: 4.8cqw; line-height: 1.28; font-weight: 500; letter-spacing: -0.005em">';
  var ABSATZ_KURZ = '<p style="margin: 0; font-size: 6.2cqw; line-height: 1.18; font-weight: 500; letter-spacing: -0.005em">';
  var GELD = /\$\d[\d,]*(?:\.\d+)?(?:[kKmM](?![A-Za-z]))?\+?(?: to \$\d[\d,]*(?:\.\d+)?(?:[kKmM](?![A-Za-z]))?\+?)?/g;
  var ETIKETT = {
    term: ['Term', '#EDE9FE', '#5B21B6'],
    risk: ['Risk', '#FEE2E2', '#B91C1C'],
    check: ['Check', '#FEF3C7', '#92400E'],
    quiz: ['Quiz', '#DBEAFE', '#1D4ED8'],

  var y, a, i, e, liste, name, vor, rechts, merk, kurz, geldfarbe, stil;

  function txt(v) { return v === null || v === undefined ? '' : String(v); }
  function esc(v) { return txt(v).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }
  function attr(v) { return esc(v).split('"').join('&quot;'); }
  function ohneMarken(v) { return txt(v).split('**').join(''); }
  /* schlichter Text: ** entfernt, Zeichen gesichert */
  function klar(v) { return esc(ohneMarken(v)); }
  function geld(s, farbe) {
    return s.replace(GELD, function (m) { return '<span style="color: ' + farbe + '; font-weight: 800">' + m + '</span>'; });
  }
  /* reicher Text: **x** wird fett, Geldbetraege bekommen Farbe. Ein ** ohne Partner wird nur entfernt. */
  function reich(v, farbe) {
    var teile = txt(v).split('**'), aus = '', n, t;
    for (n = 0; n < teile.length; n++) {
      t = geld(esc(teile[n]), farbe);

  function woerter(v) {

    return z;
  }
  function pille(art) {
    var p = ETIKETT[art];
    return '<div style="align-self: flex-start; font-size: 3.2cqw; font-weight: 700; line-height: 1.2; padding: 0.9cqw 2.4cqw; border-radius: 999px; background: ' + p[1] + '; color: ' + p[2] + '; margin-bottom: 3cqw">' + p[0] + '</div>';
  }
  function bild() {
    return sl.i ? '<img src="' + attr(txt(basis) + sl.i) + '" alt="" style="position: absolute; inset: 0; ' + VOLL + '; object-fit: cover">' : '';
  }
  /* Kopf wie bei compare und steps: derselbe Absatz wie auf den Textarten, immer in der normalen Groesse */
  function kopfBlock() {
    return sl.h ? BLOCK + ABSATZ + reich(sl.h, ORANGE) + '</p></div>' : '';
  }

  if (!sl) return '';
  y = sl.y;

  if (y === 'start') {
    a = KASTEN + 'background: #000000">' + bild() + '<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5)"></div><div style="position: absolute; inset: 0; box-sizing: border-box; padding: 6cqw 9cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #FFFFFF; text-shadow: 0 0.2cqw 1.2cqw rgba(0, 0, 0, 0.35)">';
    if (sl.c) a += '<p style="margin: 0 0 2cqw; font-size: 3.4cqw; font-weight: 700; color: rgba(255, 255, 255, 0.85)">' + klar(sl.c) + '</p>';
    a += '<h1 style="margin: 0; font-size: 8.2cqw; font-weight: 800; line-height: 1.04; letter-spacing: -0.015em; text-wrap: balance">' + klar(sl.t) + '</h1>';
    if (sl.s) a += '<p style="margin: 3cqw 0 0; max-width: 74cqw; font-size: 3.5cqw; font-weight: 600; line-height: 1.3; color: rgba(255, 255, 255, 0.9)">' + klar(sl.s) + '</p>';
    return a + '</div></div>';
  }

  if (y === 'end') return KASTEN + 'background: #000000">' + bild() + '</div>';

  if (y === 'story') {
    a = KASTEN + WEISS + INNEN;
    if (sl.n) a += '<p style="margin: 0 0 2.6cqw; font-size: 3.2cqw; font-weight: 600; line-height: 1.3; color: #6E6E73">' + klar(sl.n) + '</p>';
    a += '<div style="display: flex; flex-direction: column; gap: 1.8cqw">';
    liste = sl.m || [];
    vor = null;
    for (i = 0; i < liste.length; i++) {
      e = liste[i] || [];
      name = txt(e[0]);
      rechts = name === 'David';
      a += '<div style="align-self: ' + (rechts ? 'flex-end' : 'flex-start') + '; max-width: 80' + P + '; display: flex; flex-direction: column">';
      if (name && name !== vor) a += '<p style="margin: 0 1.4cqw 0.7cqw; font-size: 3.1cqw; font-weight: 700; color: #6E6E73; text-align: ' + (rechts ? 'right' : 'left') + '">' + klar(name) + '</p>';
      a += '<p style="margin: 0; padding: 1.7cqw 3cqw; border-radius: 3.6cqw; background: ' + (rechts ? '#144D36' : '#242626') + '; color: #FFFFFF; font-size: 4.3cqw; line-height: 1.26; font-weight: 500">' + klar(e[1]) + '</p></div>';
      vor = name;
    }
    return a + '</div></div></div>';
  }

  if (y === 'quiz') {
    a = KASTEN + WEISS + INNEN + pille('quiz') + '<p style="margin: 0 0 2.6cqw; font-size: 4.6cqw; font-weight: 800; line-height: 1.22; letter-spacing: -0.005em">' + klar(sl.q) + '</p><div style="display: flex; flex-direction: column; gap: 1.4cqw">';
    liste = sl.o || [];
    for (i = 0; i < liste.length; i++) {
      a += '<div style="display: flex; align-items: center; gap: 2.4cqw; background: #F2F2F7; border-radius: 2.4cqw; padding: 1.5cqw 2.4cqw"><span style="flex: 0 0 5cqw; height: 5cqw; box-sizing: border-box; border-radius: 50' + P + '; background: #FFFFFF; border: 0.3cqw solid #C7C7CC; display: flex; align-items: center; justify-content: center; font-size: 2.8cqw; font-weight: 800">' + String.fromCharCode(65 + i) + '</span><span style="font-size: 4cqw; line-height: 1.25; font-weight: 500">' + klar(liste[i]) + '</span></div>';
    }
    return a + '</div><p style="margin: 2.4cqw 0 0; font-size: 3.1cqw; font-weight: 600; color: #6E6E73">Swipe for the answer ' + PFEIL + '</p></div></div>';
  }

  if (y === 'compare') {
    a = KASTEN + WEISS + INNEN + kopfBlock() + '<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.4cqw; margin-top: 3.4cqw">';
    liste = sl.bx || [];
    for (i = 0; i < liste.length; i++) {
      e = liste[i] || [];
      a += '<div style="background: #F2F2F7; border-radius: 2.6cqw; padding: 3cqw"><p style="margin: 0 0 1cqw; font-size: 4.2cqw; font-weight: 800; line-height: 1.2">' + klar(e[0]) + '</p><p style="margin: 0; font-size: 3.8cqw; font-weight: 500; line-height: 1.3; color: #3A3A3C">' + klar(e[1]) + '</p></div>';
    }
    return a + '</div></div></div>';
  }

  if (y === 'steps') {
    a = KASTEN + WEISS + INNEN + kopfBlock() + '<div style="display: flex; flex-direction: column; margin-top: 3.4cqw">';
    liste = sl.st || [];
    for (i = 0; i < liste.length; i++) {
      if (i) a += '<div style="width: 0.5cqw; height: 2cqw; margin-left: 2.45cqw; background: #D1D1D6"></div>';
      a += '<div style="display: flex; align-items: center; gap: 2.6cqw"><span style="flex: 0 0 5.4cqw; height: 5.4cqw; border-radius: 50' + P + '; background: #C2410C; color: #FFFFFF; font-size: 3cqw; font-weight: 800; display: flex; align-items: center; justify-content: center">' + (i + 1) + '</span><span style="font-size: 4.2cqw; line-height: 1.25; font-weight: 600">' + klar(liste[i]) + '</span></div>';
    }
    return a + '</div></div></div>';
  }

  if (y === 'list') {
    a = KASTEN + WEISS + INNEN;
    if (sl.h) a += '<p style="margin: 0 0 2.8cqw; font-size: 4.6cqw; font-weight: 800; line-height: 1.22; letter-spacing: -0.005em">' + klar(sl.h) + '</p>';
    a += '<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2cqw">';
    liste = sl.it || [];
    for (i = 0; i < liste.length; i++) {
      a += '<li style="display: flex; gap: 2.2cqw; align-items: baseline"><span style="flex: 0 0 3.6cqw; font-size: 4.4cqw; font-weight: 800; color: #C2410C">' + (i + 1) + '</span><span style="font-size: 4.2cqw; line-height: 1.28; font-weight: 500">' + reich(liste[i], ORANGE) + '</span></li>';
    }
    a += '</ol>';
    if (sl.f) a += '<p style="margin: 3cqw 0 0; font-size: 4.4cqw; line-height: 1.28; font-weight: 500">' + reich(sl.f, ORANGE) + '</p>';
    return a + '</div></div>';
  }

  if (y === 'section') {
    return KASTEN + 'background: #0B0B0C; color: #FFFFFF">' + INNEN + '<div style="width: 10cqw; height: 1.2cqw; border-radius: 1cqw; background: #C2410C; margin-bottom: 3.6cqw"></div><h2 style="margin: 0; font-size: 8.4cqw; font-weight: 800; line-height: 1.04; letter-spacing: -0.015em; text-wrap: balance">' + klar(sl.t) + '</h2></div></div>';
  }

  if (y === 'numbers') {
    a = KASTEN + WEISS + INNEN;
    if (sl.h) a += '<p style="margin: 0; font-size: 4.4cqw; font-weight: 600; line-height: 1.28">' + klar(sl.h) + '</p>';
    a += '<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3.4cqw; margin-top: 3.4cqw">';
    liste = sl.ca || [];
    for (i = 0; i < liste.length; i++) {
      e = liste[i] || [];
      a += '<div style="border-top: 0.4cqw solid #E5E5EA; padding-top: 2.6cqw"><p style="margin: 0; font-size: 9cqw; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #C2410C">' + klar(e[0]) + '</p><p style="margin: 1.8cqw 0 0; font-size: 3.8cqw; font-weight: 500; line-height: 1.3; color: #3A3A3C">' + klar(e[1]) + '</p></div>';
    }
    return a + '</div></div></div>';
  }

  /* Textarten: statement (ohne Etikett), term, risk, check, remember. Eine unbekannte Art wird wie statement gezeichnet. */
  merk = y === 'remember';
  kurz = woerter((sl.h ? txt(sl.h) + ' ' : '') + txt(sl.t)) <= 14;
  stil = kurz ? ABSATZ_KURZ : ABSATZ;
  geldfarbe = merk ? '#FFFFFF' : ORANGE;
  a = KASTEN + (merk ? 'background: #C2410C; color: #FFFFFF">' : WEISS) + INNEN;
  if (y === 'term' || y === 'risk' || y === 'check' || merk) a += pille(y);
  a += BLOCK;
  if (sl.h) a += stil + reich(sl.h, geldfarbe) + '</p>';
  if (sl.t) a += stil + reich(sl.t, geldfarbe) + '</p>';
  return a + '</div></div></div>';
}

/* Das Innere einer Slide im alten Design. */
function slideHTML(sl){
 if(sl.k==='t')return '<div class="b"><span class="kl">'+esc(sl.c)+'</span><div class="tl'+(sl.m?' m':'')+'">'+esc(sl.t)+'</div>'+(sl.s?'<span class="kl">'+esc(sl.s)+'</span>':'')+'</div>';
 return '<div class="b">'+(sl.h?'<h3>'+esc(sl.h)+'</h3>':'')+sl.t.split('\n').map(function(p){return '<p>'+fett(p)+'</p>'}).join('')+'</div>';
}

function abschnitt(f){if(!cache[f])cache[f]=fetch(BASIS+'d/'+f+'.json').then(function(r){if(!r.ok)throw 0;return r.json()});return cache[f]}
function link(p,i){return FEED+'?p='+p.id+(i?'&s='+(i+1):'')}
function aktuell(el){var cr=el.querySelector('.cr');if(!cr||!cr.clientWidth||!cr.firstChild)return +el.dataset.i||0;return Math.max(0,Math.min(el._p.sl.length-1,Math.round(cr.scrollLeft/cr.clientWidth)))}
function pille(el,i){var n=el._p.sl.length,x=el.querySelector('.pl');if(x)x.textContent=(i+1)+'/'+n;var l=el.querySelector('.pf.l'),r=el.querySelector('.pf.r');if(l){l.hidden=i===0;r.hidden=i===n-1}}
/* David 10.11.: "bei automatischen scrollen die zahl oben rechts nicht flackert". Gleitet eine Slide von selbst (Speak, Pfeile), zeigt der Zaehler sofort das Ziel. Frueher stellte ihn das Scroll-Ereignis auf halbem Weg noch einmal auf die alte Zahl zurueck: neu, alt, neu. _ziel haelt ihn fest, bis das Gleiten 250 ms steht oder ein Finger die Slides selbst zur Seite schiebt; danach zaehlt er wieder mit der Stelle. */
function zielFrei(el,nach){clearTimeout(el._zt);if(el._ziel==null)return;el._ziel=null;if(nach)pille(el,aktuell(el))}
function zielWarte(el,ms){clearTimeout(el._zt);el._zt=setTimeout(function(){zielFrei(el,true)},ms)}
function zeige(el,i,sanft){var cr=el.querySelector('.cr');el.dataset.i=i;if(!cr||!cr.firstChild)return;var w=cr.clientWidth;
 if(sanft&&cr.scrollTo){el._ziel=i;zielWarte(el,900);cr.scrollTo({left:i*w,behavior:document.hidden?'auto':'smooth'})}else{zielFrei(el);cr.scrollLeft=i*w}
 pille(el,i)}

function wach(el){if(el._wach)return;el._wach=1;var cr=el.querySelector('.cr'),p=el._p;tonHol(p.id.slice(0,5));cr.innerHTML=p.sl.map(function(s){return s.k==='n'?'<div class="s n">'+slideNeu(s,BASIS)+'</div>':'<div class="s">'+slideHTML(s)+'</div>'}).join('');var i=+el.dataset.i||0;if(i)cr.scrollLeft=i*cr.clientWidth}
function schlaf(el){if(!el._wach||(spricht&&spricht.el===el))return;el.dataset.i=aktuell(el);el._wach=0;el.querySelector('.cr').innerHTML=''}
function nahFolge(es){es.forEach(function(e){if(e.isIntersecting)wach(e.target);else schlaf(e.target)})}
var nah=new IntersectionObserver(nahFolge,{rootMargin:'1500px 0px'});

var spricht=null;
function fertigSprechen(){if(spricht){spricht.btn.textContent='speak';spricht.btn.setAttribute('aria-pressed','false');spricht=null}}
function stop(){fertigSprechen();try{speechSynthesis.cancel()}catch(e){}try{ton.pause()}catch(e){}}
/* David 10.11.: "Bei speak beim autoscrollen sollen alle posts auf der hoehe platziert sein das genau name lichters ausserhalb des menu blur ist (wie im beispiel screenshot)". HOEHE = Abstand vom oberen Rand bis zum Kopf des Posts (.ph), aus Davids Bild gemessen (1179 x 2556, 3-fach): der Rand der Slide liegt bei 138,0, der Kopf beginnt 40,33 darueber, die Buchstaben von "lichters" bei 99,67. Der Feed scrollt im Fenster, Saved in #svs. Der allererste Post kommt nicht so tief (79 bei Stelle 0), dort ist der Nebel aber aus. */
var HOEHE=97.67;
function aufHoehe(el){var k=el.querySelector('.ph'),drin=svs.contains(el),d=k.getBoundingClientRect().top-(drin?svs.getBoundingClientRect().top:0)-HOEHE;if(Math.abs(d)<.5)return;
 /* Im Fenster zaehlt die groessere der beiden Hoehen: faehrt die Leiste des Browsers ein, ist der sichtbare Bereich hoeher als der feste, und die Seite laesst sich entsprechend weniger weit schieben. Lieber ein paar Punkte zu viel Rand als ein Post, der nicht hoch genug kommt. */
 var y=(drin?svs.scrollTop:(window.scrollY||0))+d,se=document.scrollingElement||document.documentElement,max=drin?svs.scrollHeight-svs.clientHeight:se.scrollHeight-Math.max(se.clientHeight,window.innerHeight||0),c=drin?svf:feed;
 /* Die letzten Posts einer Liste kaemen nicht so hoch, weil darunter Platz fehlt (zwei gemerkte Posts: Kopf bei 215 statt 97,67). Dann waechst der Rand unter der Liste um genau das fehlende Stueck; beim naechsten Oeffnen von Saved und beim Neuaufbau des Feeds gilt wieder der normale Rand von 40. */
 if(y>max+.5)c.style.paddingBottom=((parseFloat(c.style.paddingBottom)||40)+Math.ceil(y-max))+'px';
 var ruhe=document.hidden||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
 try{(drin?svs:window).scrollTo({top:y,behavior:ruhe?'auto':'smooth'})}catch(e){if(drin)svs.scrollTop=y;else window.scrollTo(0,y)}}
/* David 10.11.: "automatisch am ende des posts runter scrollt zum naechsten und bei vorherigen post speak ausmacht und beim naechsten anmacht und scrollt". Nur am echten Ende des Tons oder des letzten Satzes: Stop von Hand, ein Fehler oder ein anderer Post beenden die Kette. Der naechste Post startet im selben Augenblick, in dem der alte endet; so laeuft der Ton auf dem iPhone ohne neuen Tipp weiter (derselbe Spieler, den der erste Tipp freigegeben hat). */
