<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ecommerce Playbook</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<style>.gn{position:absolute;top:0;left:0;right:0;z-index:9999;height:48px;
--sfd:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--sft:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--cb:cubic-bezier(.4,0,.6,1)}
.gn ul{list-style:none;margin:0;padding:0}
.gn-content{--rate:375ms;position:absolute;top:0;left:0;width:100%;height:48px;overflow:hidden;
background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
transition:height var(--rate) var(--cb) 80ms,background var(--rate) var(--cb) 80ms}
.gn-open .gn-content{height:100vh;height:100dvh;background:#fafafc;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;transition-delay:0ms}
.gn-menu,.gn-submenu{position:absolute;top:0;left:0;width:100%}
.gn-flyout{padding-top:50px;box-sizing:border-box}
.gn-menu-list{display:flex;flex-direction:column;padding-bottom:84px}
.gn-item{opacity:0;transform:translateY(-8px);
transition:opacity .24s var(--cb) calc(.2s + var(--n) * 20ms),transform .24s var(--cb) calc(.2s + var(--n) * 20ms)}
.gn-open .gn-item{opacity:1;transform:none}
.gn-closing .gn-item{transition-delay:0s;transition-duration:min(.16s + 20ms * (8 - var(--n)),.24s)}
.gn-sub .gn-item{transition:none}
.gn-sub:not(.gn-anim) .gn-item{opacity:0;visibility:hidden;transform:translate(-8px)}
.gn-item:first-child{margin-top:-3px}
.gn-link{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:-7px;padding:3px 48px 4px;
color:#333336;text-decoration:none;font-family:var(--sfd);font-size:28px;line-height:1.1428571429;font-weight:600;
letter-spacing:-.0066em;pointer-events:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-open .gn-link{pointer-events:auto}
.gn-link:hover,.gn-link:focus-visible{color:#000}
.gn-link:focus{outline:none}
.tasten .gn-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-link-text{pointer-events:none;padding-top:7.5px;padding-bottom:7.5px}
.gn-link-chevron{display:block;height:47px;margin-top:-1px;margin-right:-48px;padding-right:19px;color:#333336;
opacity:0;visibility:hidden;transform:scale(.8);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-link-chevron svg{fill:currentColor;transform:scaleX(-1) translateZ(0)}
@media (hover:hover){.gn-open:not(.gn-sub):not(.gn-closing) .gn-link:hover .gn-link-chevron{visibility:visible;
opacity:1;transform:none;transition:visibility .24s step-start;animation:gn-chevron-in .24s var(--cb) both}}
@keyframes gn-chevron-in{0%{opacity:0;transform:translate(-4px)}to{opacity:1;transform:translate(0)}}
.gn-submenu{opacity:0;visibility:hidden;pointer-events:none;overflow:hidden}
.gn-sub .gn-submenu{opacity:1;visibility:visible;pointer-events:auto}
.gn.gn-closing .gn-submenu{opacity:0;transform:translateY(-8px);transition:opacity .24s var(--cb),transform .24s var(--cb)}
.gn-submenu-content{display:flex;flex-wrap:wrap;padding:50px 48px 0;box-sizing:border-box}
.gn-submenu-group{padding-bottom:92px}
.gn-submenu-header{margin:0;color:#6e6e73;font-family:var(--sft);font-size:17px;line-height:1.2353641176;
font-weight:400;letter-spacing:.0033em}
.gn-submenu-list-item{margin:0 -11px;font-family:var(--sft);font-size:17px;line-height:1.4705882353;font-weight:600;
letter-spacing:-.022em}
.gn-submenu-list-item:first-child{margin-top:14px}
.gn-submenu-link{display:flex;align-items:center;max-width:max-content;padding:8px 11px 7px;margin-bottom:-5px;
color:#333336;text-decoration:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-submenu-link:hover,.gn-submenu-link:focus-visible{color:#000}
.gn-submenu-link:focus{outline:none}
.tasten .gn-submenu-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-ki{position:relative;display:block;max-width:none;width:100%;height:100vh;height:100dvh;margin:0;padding:0;box-sizing:border-box;overflow:hidden;background:#f9f9f7;touch-action:none;overscroll-behavior:none;--w:min(100vw,600px,90vh);--w:min(100vw,600px,90dvh)}
#gn.gn-sub .gn-content{overflow:hidden;overscroll-behavior:none;touch-action:none}
.gn-ki-a{position:absolute;left:50%;display:block;width:var(--w);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-ki-mitte{top:calc((31px + 100% - var(--w) * .3523) / 2);transform:translate(-50%,-51.24%)}
.gn-ki-unten{bottom:0;transform:translateX(-50%)}
.gn-ki-a img{display:block;width:100%;height:auto}
.gn-fwd .gn-menu .gn-link-text{animation:gn-fwd-prev .24s var(--cb) both}
.gn-fwd .gn-submenu{animation:gn-fwd-next .24s var(--cb) .16s both}
.gn-bwd .gn-submenu{animation:gn-bwd-prev .24s var(--cb) both}
.gn-bwd .gn-menu .gn-link-text{animation:gn-bwd-next .24s var(--cb) .16s both}
@keyframes gn-fwd-next{0%{opacity:0;transform:translate(8px)}to{opacity:1;transform:translate(0)}}
@keyframes gn-fwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(-8px)}}
@keyframes gn-bwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(8px)}}
@keyframes gn-bwd-next{0%{opacity:0;transform:translate(-8px)}to{opacity:1;transform:translate(0)}}
.gn-menuback{position:absolute;top:0;left:max(0px,env(safe-area-inset-left) - 18px);z-index:3;width:48px;height:48px;
opacity:0;pointer-events:none;visibility:hidden;transform:translate(4px) scale(1);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-sub:not(.gn-bwd):not(.gn-closing) .gn-menuback{visibility:visible;transform:translate(0) scale(1);opacity:1;pointer-events:auto;
transition:opacity .24s var(--cb) .16s,transform .24s var(--cb) .16s,visibility .24s step-start .16s}
.gn.gn-closing .gn-menuback{opacity:0;transform:translate(0) scale(.8)}
.gn button:focus:not(:focus-visible){outline:none}
/* David 16.11.2026 12:0x: "Warum sind da manchmal bmaue boxenn drum? Geh sicher das die nicht mehr kommen". Das Menue setzt
   beim Wechsel ins KI-Untermenue und zurueck den Fokus per Skript, iOS zeigt dann einen blauen Rahmen. Rahmen nur noch bei
   Tab- oder Pfeiltasten (Klasse tasten am html, jeder Fingertipp nimmt sie weg). */
html:not(.tasten) .gn :focus{outline:none!important}
.gn-menuback-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;
padding:0;font:inherit;cursor:pointer;outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-menuback-button{display:flex;justify-content:center;width:100%;height:100%;color:#333336;transition:color .32s var(--cb)}
.gn-menuback-button:hover{color:#000}
.gn-chevron-icon{display:flex;margin-left:-1px}
.gn-chevron-icon svg{fill:currentColor}

.gn-page{--rate:375ms;position:fixed;pointer-events:none}
.gn-page a,.gn-page a:hover{text-decoration:none}
.gn-page .gn-content,.gn-page.gn-open .gn-content{height:100vh;height:100dvh;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
overflow:hidden;transition:none;pointer-events:none}
.gn-page.gn-open .gn-content{pointer-events:auto}
.gn-page.gn-fertig .gn-content{overflow-x:hidden;overflow-y:auto}
.gn-schleier,.gn-tuch{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;pointer-events:none}
.gn-schleier{background:rgb(232,232,237);opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb)}
.gn-page.gn-open .gn-schleier{opacity:1;transition:opacity .36s var(--cb) .1s}
.gn-tuch{transform:translate3d(0,-100%,0);will-change:transform;transition:transform var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-tuch{transform:translate3d(0,0,0);transition-delay:0ms}
.gn-glas,.gn-voll{position:absolute;top:0;right:0;bottom:0;left:0}
.gn-glas{background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.gn-voll{background:#fafafc;opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-voll{opacity:1;transition-delay:0ms}
.gn-page.gn-fertig .gn-glas{visibility:hidden}
.gn-page .gn-item{will-change:opacity,transform}
.gn-strich{position:absolute;left:50%;top:50%;width:24px;height:6px;margin:-3px 0 0 -12px;will-change:transform}
.gn-strich-oben{transform:translate(0,-4px)}
.gn-strich-unten{transform:translate(0,3px)}
.gn-open .gn-strich-oben{animation:gn-oben-auf .24s linear both}
.gn-open .gn-strich-unten{animation:gn-unten-auf .24s linear both}
.gn-closing .gn-strich-oben{animation:gn-oben-zu .24s linear both}
.gn-closing .gn-strich-unten{animation:gn-unten-zu .24s linear both}
.gn-menutrigger{position:absolute;top:3px;right:max(0px,env(safe-area-inset-right) - 16px);z-index:3;width:48px;pointer-events:auto}
.gn-menutrigger-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;padding:0;font:inherit;cursor:pointer;
outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0);position:relative;display:flex;justify-content:center;align-items:center;
width:48px;height:48px;color:#000;opacity:.8;transition:opacity .32s var(--cb),color .32s var(--cb)}
.gn-menutrigger-button:hover{opacity:1}
html.gn-lock,html.gn-lock body{overflow:hidden}
html.srch .gn{display:none}

:root{--fg:#1d1d1f;--mut:#6e6e73;--strich:#808080;--hl:1px;color-scheme:light}
/* David 25.11.2026 02:1x: "bei bild 2 siehst du wie dünn der grau strich sein muss und das der exakt auf dem rand zwischen weiß und post sein muss".
   Ersetzt den 1,34-px-Strich vom 09.11.: jetzt genau 1 Bildpunkt (--hl je Bildschirmdichte), Farbe aus Bild 2. Rahmen unter 1 Bildpunkt rundet
   WebKit auf genau 1 auf; die Slide bleibt, wo sie war, der Strich liegt direkt darueber und darunter. */
@media (min-resolution:2dppx){:root{--hl:.5px}}
@media (min-resolution:3dppx){:root{--hl:.3333px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;background:#fff;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
#feed,#svf{max-width:560px;margin:0 auto;padding:79px 0 40px}
/* Instagram-Block (David 24.11.2026 22:1x, Vorlage d5dd5af1-image.png, 393 pt breit): von der Unterkante einer Slideshow bis zur
   Oberkante der naechsten genau 156 pt, darin Leiste, Bildunterschrift, Datum und der Kopf des naechsten Posts. Jede Lage unten ist die
   Tintenkante im Bild (50 % Deckung) in pt ab der Unterkante der Slide; die graue Linie unter und ueber jeder Slide liegt wie seit 09.11. in
   diesem Abstand. Farben aus dem Bild (sRGB): Symbole und Text #0c1014, Namen #25282c, Grau #6a6e74. Schrift im Bild: Namen 14 pt halbfett,
   Text 14 pt, Datum und Zeile unter dem Namen 12 pt, Zahlen 14 pt halbfett; im Browser gleich breit mit 13,9 / 12 / 13,75 px. */
.p{margin:0 0 28.78px}
.ph{position:relative;height:32px;color:#0c1014}
.av{position:absolute;left:10.3333px;top:0;display:block;width:32px;height:32px;border-radius:50%;background:#fff}
.rg{position:absolute;left:-4px;top:-4px;width:40px;height:40px;overflow:visible;fill:none;stroke-width:2;pointer-events:none}
.rg .rh{stroke:rgba(0,0,0,.16);stroke-width:.5}
.rg .ri{stroke-width:1.9}
.ig0{stop-color:#fec900;stop-color:color(display-p3 0.9647 0.7961 0.2549)}.ig1{stop-color:#fdb916;stop-color:color(display-p3 0.9529 0.7373 0.2706)}.ig2{stop-color:#ffa112;stop-color:color(display-p3 0.949 0.6471 0.2431)}.ig3{stop-color:#f88710;stop-color:color(display-p3 0.9137 0.5529 0.2157)}.ig4{stop-color:#fc5813;stop-color:color(display-p3 0.9137 0.3922 0.1882)}.ig5{stop-color:#fe141f;stop-color:color(display-p3 0.9137 0.2196 0.1882)}.ig6{stop-color:#fb0862;stop-color:color(display-p3 0.902 0.2039 0.3922)}.ig7{stop-color:#fd0684;stop-color:color(display-p3 0.9098 0.2039 0.5137)}.ig8{stop-color:#f70ba0;stop-color:color(display-p3 0.8902 0.2039 0.6157)}.ig9{stop-color:#e90fb8;stop-color:color(display-p3 0.8392 0.1961 0.702)}.ig10{stop-color:#ea00cd;stop-color:color(display-p3 0.8431 0.1804 0.7804)}
/* Haken (David 25.11.2026): 35 Bildpunkte bei 3-fach = 11,6667 pt; Unterkante 1,1667 pt unter der Grundlinie, Oberkante auf Hoehe der Oberlaenge;
   Abstand Tinte zu Tinte 5,67 pt. Farbe gemessen (Display P3 63/150/247, entspricht Instagrams #0095F6). */
.vf{display:inline-block;width:11.6667px;height:11.6667px;margin-left:5.2px;vertical-align:-1.1667px;fill:#0098ff;fill:color(display-p3 .2471 .5882 .9686)}
.av img{display:block;width:32px;height:32px;border-radius:50%}
.nm{position:absolute;top:-.44px;left:52px;padding:0 6px 0 0;font-size:13.9px;line-height:17px;font-weight:600;letter-spacing:0;color:#25282c;white-space:nowrap}
/* Zeile unter dem Namen: Note und Listen (statt "Suggested for you"). Note, ihre Groesse zur Schrift und ihr Abstand zum Wort wie in Bild 2
   zwischen Note und "Allba": Note 10 x 10,67 pt, unten 1 pt unter der Grundlinie, Luecke Tinte zu Tinte 6,67 pt. Tippflaeche 120 x 26 pt. */
.sp{position:absolute;left:44px;top:14px;width:150px;height:26px;color:#0c1014;font-size:12px;line-height:15px;letter-spacing:0;text-align:left}
.sp .nt{position:absolute;left:7.3333px;top:3.6667px;width:12.6667px;height:13.3333px;fill:currentColor}
.sp span{position:absolute;left:24.6px;top:2.5667px;white-space:nowrap}
/* Rechts im Kopf Folgen-Symbol und zwei Striche wie in Bild 1; der ganze Bereich fuehrt zu Davids Instagram */
.rt{position:absolute;right:0;top:-6px;width:93px;height:44px;color:#0c1014}
.rt svg{position:absolute;display:block;fill:currentColor}
.rt .if{right:54px;top:11px;width:24.6667px;height:20.6667px}
.rt .ik{right:11px;top:15px;width:22.6667px;height:12.6667px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
/* David 09.11.: Linie direkt ueber und unter jeder Slide, damit weisse Slides sich vom Hintergrund abheben. Exakt so dick wie die 2 Striche oben rechts: die sind 4 Bildpunkte hoch (3-fach gemessen 92, 51, 51, 92). Rahmen werden auf ganze Bildpunkte abgerundet, 1,34 ergibt bei 3-fach immer genau 4, bei jedem Post gleich. Farbe genau 50 Prozent Schwarz und 50 Prozent Weiss (David 09.11.). Die Slide selbst und alles darum bleibt, wo es war, die Linie liegt in der freien Luecke. */
/* Umbau 25.11.2026: Buehne 3:2 statt 4:3 (David 24.11.). Grund weiss statt grau: jede Slide hat jetzt das neue Design, Grau saehe man nur noch kurz vor dem Zeichnen. */
.c{position:relative;margin-top:calc(10.3333px - var(--hl));border-top:var(--hl) solid #e9e8e6;border-bottom:var(--hl) solid #e9e8e6;border-color:color(display-p3 .9137 .9098 .902);background:#fff;container-type:inline-size}
.c::before{content:"";display:block;padding-top:66.6667%}
.cr{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Doppeltipp likt, Halten teilt (David 24.11.): beim Halten kein Systemmenue, keine Textauswahl, kein Ziehen der Bilder */
.cr img{-webkit-user-drag:none}
.cr::-webkit-scrollbar{display:none}

.s .b{font-size:6.107vw;line-height:1.22;letter-spacing:-.012em;width:100%}
@supports (font-size:1cqw){.s .b{font-size:6.876cqw}}
.s h3{font:inherit;font-weight:600;margin:0 0 .5em}
.s p{margin:0 0 .5em}.s p:last-child{margin-bottom:0}
.s b{font-weight:600}
.s .tl{font-weight:600;font-size:1.25em;line-height:1.15;letter-spacing:-.018em}
.s .tl.m{font-size:1em;line-height:1.22;letter-spacing:-.012em}
.s .kl{display:block;font-size:.66em;line-height:1.3;font-weight:400;color:#1d1d1f;letter-spacing:0}
.s .kl:first-child{margin-bottom:.8em}.s .kl:last-child{margin-top:.8em}
/* Neues Slide-Design (David 10.11.: "Bau die Slides genau so"): Slides mit der Klasse n zeichnet slideNeu() aus ecom_slides.js, alle Masse stehen dort inline wie in Davids Vorlage. Hier wird nur zurueckgesetzt, was die alten Regeln von .s und der Seite sonst hineintragen wuerden (Flex-Kasten, Rand, Mitte, Grau, Kastenmass). Gemessen wird das von ecom_slides_pruefen.sh: jedes Element liegt wie in der Vorlage. */
.s.n{display:block;padding:0;text-align:left;background:#fff;color:#111;line-height:normal;letter-spacing:normal;font-size:16px;font-weight:400}
.s.n *{box-sizing:content-box}
/* Umbau 25.11.2026: Slides aus Daten der alten Form (Klasse a) enthalten manchmal lange Woerter ohne Leerzeichen (Adressen, Feldnamen). Dort darf eine Zeile mitten im Wort brechen, statt aus der Slide zu ragen. Die Slides der Vorlage bleiben unberuehrt. */
.s.n.a{overflow-wrap:anywhere}
/* System aus Davids Bildern (09.11., 3-fach gemessen): 1/5 bis 5/5 sind alle 101,9 x 77,5 Bildpunkte, Schrift mittig; 1/13 ist 109 breit. Das passt nur so:
   feste Mindestbreite 33,97 pt fuer kurze Zahlen, darueber Textbreite plus fester Rand 7,17 pt je Seite. Volle Kapsel, rechte Kante bleibt stehen. Alles waechst mit der Slide-Breite. */
.pl{position:absolute;top:14.4px;right:14.4px;min-width:33.97px;height:25.8px;padding:0 7.17px;border-radius:12.9px;background:rgba(45,45,45,.54);color:#fff;font-size:11.7px;line-height:25.8px;text-align:center;white-space:nowrap;pointer-events:none;z-index:2}
@supports (font-size:1cqw){.pl{top:3.664cqw;right:3.664cqw;min-width:8.643cqw;height:6.565cqw;padding:0 1.824cqw;border-radius:3.282cqw;font-size:2.98cqw;line-height:6.565cqw}}
.tn{position:absolute;right:14.1667px;bottom:14.6667px;z-index:3;width:26px;height:26px;margin:0;padding:0;border:0;border-radius:50%;background:rgba(48,51,50,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;fill:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
@supports (font-size:1cqw){.tn{right:3.605cqw;bottom:3.732cqw;width:6.616cqw;height:6.616cqw}}
.tn svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;overflow:visible}
.tn .ts{fill:none;stroke:currentColor;stroke-linecap:round}
.tn .tan,.tn.an .taus{display:none}.tn.an .tan{display:block}
.pf{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;font-size:18px;line-height:1;color:#1d1d1f}
.pf.l{left:10px}.pf.r{right:10px}
@media (hover:hover) and (pointer:fine){.c:hover .pf{display:flex}.c .pf[hidden]{display:none}}
/* Leiste wie Bild 1, Symbole an ihren Stellen aus dem Bild (Tinte, pt ab Unterkante der Slide): Herz x 12,67 bis 35,33, Sprechblase 89 bis 111,
   Repost 131 bis 149, Papierflieger 169 bis 191, Merken 360 bis 378 (rechts 15 pt Rand), alle y 12,67 bis 35,33. Jedes svg ist der Ausschnitt
   aus dem Bild, darum steht hier dessen Lage. Tippflaechen 44 x 44 pt. */
.ic{position:relative;height:40px;margin-top:calc(0px - var(--hl));color:#0c1014}
.ic button,.ic a{position:absolute;display:block;top:2px;width:44px;height:44px}
.ic svg{position:absolute;display:block;overflow:visible;fill:currentColor}
.ic .v{display:none}
.bl.on .o,.bm.on .o{display:none}
.bl.on .v,.bm.on .v{display:inline}
/* David 25.11.2026 01:3x: "Like button in der farbe nachdem man liket", Rot aus seinem Bild (Display P3 254/1/42), sRGB-Ersatz davor. */
.ic .bl.on svg{color:#ff0012;color:color(display-p3 .9961 .0039 .1647)}
.ic .bl{left:2px}.ic .bl svg{left:9.3333px;top:10.6667px;width:25.3333px;height:23px}
.ic .bi{left:78px}.ic .bi svg{left:9.6667px;top:9.6667px;width:24.6667px;height:24.6667px}
.ic .br{left:118px}.ic .br svg{left:11.6667px;top:9.3333px;width:20.6667px;height:25.3333px}
.ic .bs{left:158px}.ic .bs svg{left:9.6667px;top:10.6667px;width:24.6667px;height:23px}
.ic .bm{right:2px}.ic .bm svg{left:11.6667px;top:10.6667px;width:20.6667px;height:22.6667px}
/* Zahlen wie in Bild 1, fest (David 24.11.: "100k und 69 laesst du auf jeden Fall drin"), aendern sich beim Liken nicht. Tinte "100K" x 42 bis 74,67, "69" 198 bis 214,33, Grundlinie 29. */
.zl,.zs{position:absolute;top:15.6133px;font-size:13.75px;line-height:17px;font-weight:600;letter-spacing:0;color:#0c1014;white-space:nowrap;pointer-events:none}
.zl{left:41.3px}.zs{left:197.3px}
.bl.pop svg{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.72)}100%{transform:scale(1)}}
/* Bildunterschrift: "lichters" halbfett, dahinter der Titel des Posts, eine Zeile. Passt sie nicht: nach dem letzten ganz passenden Wort "..."
   und ein graues "more" (kuerzen() im JS); Tipp darauf klappt den ganzen Titel auf. Grundlinie 61 pt, Tinte ab 12,67 pt. */
.cap{margin:7.06px 12px 0;font-size:13.9px;line-height:18px;word-spacing:.2px;letter-spacing:0;color:#0c1014;white-space:nowrap;overflow:hidden}
.cap.auf{white-space:normal;overflow:visible}
.cap .cn{font-weight:600;color:#25282c}
.cap .more{display:none;color:#6a6e74;font:inherit;word-spacing:inherit;cursor:pointer}
.cap.zu .more{display:inline}
.cap.zu{cursor:pointer}
/* Datum statt "23 hours ago" (David: "da soll 2026-11-24 stehen"), grau wie im Bild, Grundlinie 82 pt */
.tm{display:block;margin:4.84px 0 0 12px;font-size:12px;line-height:15px;letter-spacing:0;color:#6a6e74}
/* Doppeltipp: grosses Herz in der Mitte der Slide, poppt auf und verschwindet. Weiss wie bei Instagram (gemessen 24.11.: die erste Slide jedes der 19 Posts
   ist dunkel, Mittel 11 bis 106 von 255), mit leichtem Schatten, damit es auch auf hellen Stellen eines Fotos steht. */
.hp{position:absolute;left:50%;top:50%;z-index:3;width:88px;height:80px;margin:-40px 0 0 -44px;color:#fff;filter:drop-shadow(0 1px 8px rgba(0,0,0,.3));pointer-events:none;animation:hp .9s ease-out both}
.hp svg{display:block;width:100%;height:100%;fill:currentColor;overflow:visible}
@keyframes hp{0%{transform:scale(0);opacity:0}15%{transform:scale(1.2);opacity:.9}25%{transform:scale(.95)}35%{transform:scale(1)}75%{transform:scale(1);opacity:.9}100%{transform:scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.hp{animation:hpr .8s linear both}@keyframes hpr{0%{opacity:0}20%{opacity:.9}70%{opacity:.9}100%{opacity:0}}}
/* David 09.11.: Merken-Symbol oben links, gleiche Hoehe und gleicher Randabstand wie die 2 Striche rechts. Tippen schiebt Saved herein (dieselbe Seite, seit 11.11. ohne eigene Adresse), das Symbol wird nie schwarz.
   Seit 24.11. dasselbe neue Merken-Symbol wie in der Leiste (Bild 1), Mitte wie bisher. */
#saved{position:fixed;top:2.5px;left:max(0px,calc(env(safe-area-inset-left) - 16px));z-index:9001;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
#saved svg{display:block;overflow:visible;width:20.6667px;height:22.6667px;fill:var(--fg)}
/* David 24.11.: "wenn man nach unten scrollt ... dieser Bereich oben mit dem Nebel nicht angezeigt werden soll. Wenn man nach oben scrollt, soll
   der Bereich wieder rauskommen." Nebel, Titel, Merken-Symbol und die 2 Striche gleiten zusammen nach oben weg (Klasse kweg am html, kopfScroll()
   im JS); nie bei offenem Menue oder offenem Saved, ganz oben immer da. */
#fx,#kopf,#saved,.gn-page .gn-menutrigger{transition:transform .3s cubic-bezier(.32,.72,0,1)}
html.kweg #fx,html.kweg #kopf,html.kweg #saved,html.kweg .gn-page:not(.gn-open) .gn-menutrigger{transform:translate3d(0,-104px,0)}
@media (prefers-reduced-motion:reduce){#fx,#kopf,#saved,.gn-page .gn-menutrigger{transition:none}}
#saved:active svg,#zu:active{opacity:.5}
html.gn-lock #saved,html.gn-lock #zu{visibility:hidden}
/* Davids Skizze 09.11.: Kapitelname fett, darunter lichters, mittig. Lage aus der Skizze (3-fach). Nie Auslassungspunkte. */
#kopf,#sv .kopf{top:0;left:0;right:0;height:60px}
#kopf{position:fixed;z-index:9000}
#sv .kopf{position:absolute;z-index:2;touch-action:none}
/* David 10.11.: "oben kein balken sondern den selben nebel wie /diet hat". Der Kopf hat keinen Hintergrund, der Inhalt laeuft unter einem weissen Nebel durch: 104 hoch (HOEHE beim Autoscroll haengt daran), aus bei Scroll 0, an ab 2 px (nebel() im JS). Titel, Merken-Symbol, Pfeil und die 2 Striche liegen darueber und bleiben tippbar.
   David 11.11.: "Der nebel ist mega unsmooth". Vorher eine Unschaerfe mit harter Maskenkante und Weiss als gerade Rampe, beides stand als Linie ueber Fotos. Die Ebenen baut nebel_css(): vier Unschaerfen (1, 2, 4, 8 px), jede laeuft nach unten als S-Kurve aus, darueber Weiss .85, ab 42 Prozent als S-Kurve auf 0 (unter "lichters" noch .81). Ein- und Ausblenden auf den Ebenen selbst, nie am Elternteil: Deckkraft unter 1 am Elternteil macht es zur Backdrop-Wurzel, dann springt die Unschaerfe erst am Ende der Blende an. */
.navfx{top:0;left:0;right:0;height:104px;pointer-events:none}
.navfx i{position:absolute;inset:0;opacity:0;transition:opacity .2s}
.navfx.on i{opacity:1}
#fx{position:fixed;z-index:8999}
/* Saved scrollt in #svs, darum ein eigener Nebel in #sv: ueber dem Scroller, unter .kopf. #svs bekommt eine eigene Ebene (z-index 0), sonst malt die Pille 1/16 (z-index 2) ueber Nebel und Kopf. Solange die Seite draussen ist, schaltet der Nebel ohne Uebergang, damit beim Hereinschieben kein alter Nebel nachblendet. */
#svfx{position:absolute;z-index:1}
#svs{z-index:0}
#sv:not(.an) #svfx i{transition:none}
#kt,#sv .kt{position:absolute;top:16.64px;left:44px;right:44px;margin:0;font-size:16px;line-height:20px;font-weight:700;letter-spacing:0;text-align:center;white-space:nowrap;overflow:hidden;color:var(--fg)}
#kn,#sv .kn{position:absolute;top:36.2px;left:50%;transform:translateX(-50%);font-size:12.5px;line-height:16px;color:var(--fg);white-space:nowrap}
/* Saved: kommt von rechts und geht nach rechts zurueck (David 09.11.), in derselben Seite ohne eigene Adresse (David 11.11.). Die 2 Striche liegen darueber und bleiben stehen. */
#sv{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9100;background:#fff;visibility:hidden;transform:translate3d(100%,0,0);will-change:transform;box-shadow:-1px 0 0 rgba(0,0,0,.05),-14px 0 34px rgba(0,0,0,.07)}
#sv.an{visibility:visible;transform:translate3d(0,0,0)}
#sv.zug{transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s linear .42s}
#sv.zug.an{transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s}
#svs{position:absolute;top:0;right:0;bottom:0;left:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;scrollbar-width:none}
#svs::-webkit-scrollbar{display:none}
#svf{min-height:calc(100% + 1px)}
#zu{position:absolute;top:2.5px;left:max(0px,calc(env(safe-area-inset-left) - 18px));width:48px;height:48px;display:flex;justify-content:center;color:#333336}
@media (prefers-reduced-motion:reduce){#sv{transform:none;opacity:0;box-shadow:none}#sv.an{transform:none;opacity:1}#sv.zug{transition:opacity .2s linear,visibility 0s linear .2s}#sv.zug.an{transition:opacity .2s linear,visibility 0s}}
.leer{text-align:center;color:var(--mut);font-size:15px;line-height:1.4;padding:60px 24px}
#sent{height:1px}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);background:rgba(29,29,31,.92);color:#fff;font-size:14px;line-height:1;padding:11px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999}
#toast.an{opacity:1;transform:translate(-50%,0)}
