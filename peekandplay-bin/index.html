<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Peek and Play, sensory bin</title><style>
:root{--t:#1d1d1f;--g:#6e6e73;--b:#d2d2d7;--a:#0071e3}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--t);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px 80px}h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}h2{font-size:22px;margin:36px 0 8px}
p.lead{color:var(--g);margin:0 0 24px}ol,ul{padding-left:22px}li{margin:8px 0}a{color:var(--a)}.btn{display:inline-block;background:var(--t);color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600}
.cp{margin:6px 0}.lab{font-size:13px;color:var(--g)}textarea{width:100%;font:14px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--b);border-radius:10px;padding:8px}
.cp button{margin-top:4px;border:0;background:var(--a);color:#fff;border-radius:8px;padding:6px 14px;font-weight:600}.im{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.im img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--b)}
.note{background:#f5f5f7;border-radius:14px;padding:14px 16px;margin:20px 0}</style></head><body><main><h1>Your two policy texts</h1><p class="lead">They match the new theme: one delivery time, one 30-day guarantee, free shipping on 2+.</p><section><h2>Shipping policy</h2><p>Settings, Policies, Shipping policy: delete the old text, paste this, save.</p><div class="cp"><textarea id="t1" readonly rows="18">Shipping Policy

Where we ship
We ship to every country you can choose at checkout, always with tracking. Orders of 2 or more bins ship free. A single bin ships for $4.99.

Order confirmation
Right after you place your order, we email you a confirmation with your order number and a summary of your purchase. If it has not arrived within an hour, please check your spam folder or write to hello@peekandplay.store.

Processing time
We pack your order and hand it to the carrier within 1 to 2 business days (Monday to Friday, excluding holidays). Please check your shipping address at checkout. If it needs a change, email us before your order ships and we update it.

Tracking
As soon as your order ships, you receive a second email with your tracking number and a link to follow your parcel. Every order ships with tracking.

Delivery time
After your order ships, delivery takes 5 to 10 business days to the US, the UK, Canada and New Zealand, up to 15 business days to Australia and up to 25 business days to all other countries. Counted from the day you order, that is 6 to 12 business days in total to the US. The product page shows the expected US delivery dates for an order placed today.

Carriers
We hand every order to a tracked carrier that serves your country. Your shipping email links straight to the carrier's tracking page.

Delays
Delivery times are estimates. Customs checks, severe weather and busy holiday weeks can add a few days. If a delay is on our side, we email you. If your parcel has not arrived within the delivery window, or tracking has stopped moving, write to hello@peekandplay.store with your order number. We check with the carrier, and if your parcel is lost, we send a new one or refund your order.

Out of stock
We do not take custom orders. If an order cannot ship within 1 to 2 business days, we email you the new ship date and you can choose to cancel for a full refund.

Questions
Questions about your delivery? Email hello@peekandplay.store with your order number. We read every email and are happy to help.</textarea><button onclick="c('t1',this)">Copy</button></div></section><section><h2>Refund policy</h2><p>Settings, Policies, Refund policy: delete the old text, paste this, save.</p><div class="cp"><textarea id="t2" readonly rows="18">Returns and Refunds

Our 30-day money-back guarantee
Every Peek and Play order comes with a 30-day money-back guarantee. If the bin is not right for you, send it back within 30 days of delivery and we refund the full price. If it arrives damaged, faulty or not what you ordered, we replace it or refund you, at no cost to you.

What we need back
Please send the bin back complete with its sand and all accessories, and not damaged after delivery. Contact us before you send anything back, so we can give you the return address and match the parcel to your order.

How to start a return
1. Email hello@peekandplay.store with your order number and a short note on why you are returning it.
2. We reply with the return address.
3. Send the bin back with a tracked service and reply with the tracking number.

Return shipping
If you changed your mind, the return shipping is on you; please use a tracked service. If the bin arrived damaged, faulty or wrong, we cover the cost, and if we do not need it back, you keep it.

Packs
If you return all bins from a 2-pack or a 3-pack, we refund the full order. If you return only some of them, we refund the price you paid per bin: $71.00 each from a 2-pack and $60.00 each from a 3-pack.

Shipping costs
Orders of 2 or more ship free. For a single bin, the $4.99 shipping fee is refunded when the item arrived damaged, faulty or wrong.

Damaged or faulty items
Send us a photo and your order number within 30 days of delivery, the same 30 days as the guarantee. We send a replacement or refund you, whichever you prefer.

Exchanges
There is one product, so an exchange means a free replacement for a damaged, faulty or wrong item, and we pay the shipping both ways. If you would like more bins, simply place a new order.

Cancellations
Changed your mind before your order ships? Email us as soon as possible and we cancel it with a full refund.

Refunds
As soon as your bin is back with us, we send the refund to your original payment method. Your bank or card usually shows it a few business days later.

Questions
Write to hello@peekandplay.store. We read every email and are happy to help.</textarea><button onclick="c('t2',this)">Copy</button></div></section></main><script>function c(i,b){var t=document.getElementById(i);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)}</script></body></html>
